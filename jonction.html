<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shell.css">
<meta name="theme-color" content="#0e9062">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jonction">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Paramètres de jonction</title>
<style>
:root{--acc:#0e7a52;--hot:#c8501e;--ok:#2e7d4f;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="clair"]){--acc:#3fd488;--hot:#f0895a;--btnink:#0d1512}}
:root[data-theme="sombre"]{--acc:#3fd488;--hot:#f0895a;--btnink:#0d1512}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#etat{font-size:13px;color:var(--mute);margin:0 2px 10px}
#etat.off{color:var(--hot)}
main{flex:1;overflow-y:auto;padding:14px max(14px,calc((100vw - 1040px)/2)) 90px}
section{display:none}section.on{display:block}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
select,input,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.carte{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;padding:12px 14px;margin-top:14px}
.carte h2{margin:0 0 8px;font-size:19px}
.carte .tag{font-size:12px;color:var(--ok);font-weight:600;margin-left:6px}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.grille div span{display:block;font-size:12px;color:var(--mute)}
.grille div b{font-size:20px;color:var(--hot)}
.grille .pleine{grid-column:1/-1}
.grille .pleine b{font-size:16px;color:var(--ink);font-weight:500}
.pied{margin-top:8px;font-size:12px;color:var(--mute)}
.tableau{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{position:sticky;top:0;background:var(--bg);font-weight:650}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:8px;background:var(--acc);color:var(--btnink);font:inherit;font-weight:650}

.btn:disabled{opacity:.45}
.msg{margin-top:12px;padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:14px}
tr[data-n]{cursor:pointer}
.btn.sec{background:none;color:var(--acc);border:1px solid var(--line)}
.btn.sup{background:var(--hot);color:#fff}
dialog{width:min(92vw,520px);max-height:92vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.55)}
.logo{display:block;width:100%;max-width:320px;margin:0 auto 4px;background:#fff;padding:8px 14px;border-radius:8px}
#sugg{display:none;max-height:45vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-top:4px}
#sugg button{display:block;width:100%;text-align:left;padding:13px 12px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:var(--ink)}
.vide{color:var(--mute);margin-top:24px;text-align:center}
  [hidden] { display:none !important; }
  #f-m, #e-m { text-transform: uppercase; }
  .prop { margin-top:12px; padding:12px; border:2px solid #e0b100; border-radius:12px; background:var(--card); }
  .prop h3 { margin:0 0 6px; font-size:16px; } .prop .qui { font-size:12px; color:var(--mute); margin-bottom:8px; }
  .prop table { width:100%; font-size:14px; white-space:normal; } .prop td, .prop th { padding:4px 6px; }
  .prop .chg { background:var(--warnbg,#fff3cd); color:var(--warnink,#5c4400); font-weight:650; }
  .prop .anc { text-decoration:line-through; color:var(--mute); }
  .prop .acts { display:flex; gap:8px; margin-top:10px; } .prop .acts .btn { margin-top:0; padding:11px 6px; }
  .navpast { background:#e0b100; color:#3a2c00; border-radius:999px; font-size:11px; font-weight:800; padding:1px 6px; margin-left:4px; }
  .tps { display: flex; gap: 6px; } .tps input { flex: 1; min-width: 0; } .tps select { flex: none; width: 118px; }
</style>
</head>
<body>
<main>
  <div id="etat">Chargement…</div>
  <section id="s-rech" class="on">
    <label for="matiere">Matière</label>
    <input id="matiere" type="search" placeholder="Tape les premières lettres…" autocomplete="off">
    <div id="sugg"></div>
    <div id="resultats"></div>
  </section>
  <section id="s-base">
    <input id="filtre" type="search" placeholder="Filtrer (matière, presse, accessoire…)">
    <div class="tableau"><table id="table"></table></div>
    <p class="pied" id="compte"></p>
    <p class="pied">Touche une ligne pour la corriger (code administrateur).</p>
    <div id="outilUnites" hidden style="margin-top:14px;padding:14px;border:2px solid #e0b100;border-radius:14px;background:var(--warnbg,#fff3cd);color:var(--warnink,#5c4400)">
      <b>Uniformiser les temps (s / min)</b>
      <p class="pied" id="infoUnites" style="margin:6px 0 10px"></p>
      <button class="btn" id="btnUnites" type="button">Mettre tous les temps au même format</button>
      <div id="avanceUnites" class="pied" style="margin-top:8px"></div>
    </div>
  </section>
  <section id="s-ajout">
    <div id="hors" class="msg" style="display:none">Connexion requise pour enregistrer un paramètre.</div>
    <label for="f-m">Matière</label><input id="f-m" list="l-m" autocomplete="off">
    <label for="f-p">Presse</label><input id="f-p" list="l-p" autocomplete="off">
    <datalist id="l-m"></datalist><datalist id="l-p"></datalist>
    <div class="row2">
      <div><label for="f-ts">Température supérieure</label><input id="f-ts" inputmode="decimal"></div>
      <div><label for="f-ti">Température inférieure</label><input id="f-ti" inputmode="decimal"></div>
      <div><label for="f-pr">Pression</label><input id="f-pr" inputmode="decimal"></div>
      <div><label for="f-t">Temps</label><div class="tps"><input id="f-t" inputmode="decimal"><select id="f-tu" aria-label="Unité du temps"><option value="">Unité ?</option><option value="s">secondes</option><option value="min">minutes</option></select></div></div>
    </div>
    <label for="f-a">Accessoire</label><input id="f-a">
    <label for="f-c">Commentaire</label><textarea id="f-c" rows="3"></textarea>
    <button class="btn" id="envoyer">Enregistrer le paramètre</button>
    <div id="retour"></div>
  </section>
  <section id="s-prop">
    <p class="pied" style="margin-top:0">Propositions envoyées par l’équipe : rien n’est enregistré dans la base tant qu’un administrateur ne les a pas validées.</p>
    <div id="listeProp"></div>
  </section>
</main>
<dialog id="dlg"></dialog>
<nav class="barreOnglets">
  <button type="button" data-s="s-rech" class="on"><span data-ic="search"></span><span>Recherche</span></button>
  <button type="button" data-s="s-base"><span data-ic="list"></span><span>Base</span></button>
  <a href="./" id="navAccueil"><span data-ic="home"></span><span>Accueil</span></a>
  <button type="button" data-s="s-ajout"><span data-ic="plus"></span><span id="libAjout">Ajout</span></button>
  <button type="button" data-s="s-prop" id="navProp" hidden><span data-ic="list"></span><span>À valider<span class="navpast" id="navPast" hidden></span></span></button>
</nav>

<script src="config.js"></script>
<script src="commun.js"></script>
<script>
const API_URL = (window.CONFIG && window.CONFIG.URL_JONCTION) || "";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vide = v => (v === "" || v == null) ? "—" : esc(v);
const dateFr = d => /^\d{4}-\d{2}-\d{2}$/.test(d) ? d.split("-").reverse().join("/") : (d || "");
const tri = (a, b) => String(a).localeCompare(String(b), "fr", {numeric:true, sensitivity:"base"});

const MSG_ADMIN = "Réservé à l’administrateur : déconnecte-toi puis reconnecte-toi depuis l’accueil avec le code administrateur.";
let rows = [], maj = "", MATS = [];
try { const c = JSON.parse(localStorage.getItem("cache") || "null"); if (c) { rows = c.rows; maj = c.maj; } } catch (e) {}

/* Temps : saisi avec son unité (secondes ou minutes) et enregistré sous la forme « 45 s » ou « 2 min » */
function tempsLire(txt) {
  const m = String(txt == null ? "" : txt).trim().match(/^(\d+(?:[.,]\d+)?)\s*(s|sec|secs|seconde|secondes|mn|min|mins|minute|minutes)?\.?$/i);
  if (!m) return {val: String(txt == null ? "" : txt).trim(), unite: "", libre: true};
  const u = (m[2] || "").toLowerCase();
  return {val: m[1], unite: !u ? "" : (u[0] === "s" ? "s" : "min"), libre: false};
}
// Anciennes valeurs sans unité : considérées en minutes (à corriger en secondes quand ce n'est pas le cas)
function tempsAffiche(txt) { const t = tempsLire(txt); return !t.libre && t.val && !t.unite ? t.val + " min" : txt; }
function tempsFormat(val, unite) { val = String(val).trim(); return val && unite && /^\d+(?:[.,]\d+)?$/.test(val) ? val + " " + unite : val; }
function tempsManque(val, unite) { return /^\d+(?:[.,]\d+)?$/.test(String(val).trim()) && !unite; }
const norm = s => String(s).toLowerCase().replace(/\s+/g, " ").trim();
let CODE = "", ADMIN = "";
try { CODE = localStorage.getItem("code") || ""; ADMIN = localStorage.getItem("admin") || ""; } catch (e) {}

function code() {
  if (!CODE) {
    CODE = prompt("Code d’accès de l’équipe :") || "";
    if (CODE) try { localStorage.setItem("code", CODE); } catch (e) {}
  }
  return CODE;
}

function etat() {
  const e = $("#etat"), off = !navigator.onLine;
  e.className = off ? "off" : "";
  e.textContent = (off ? "Hors ligne · " : "") + (maj ? "Dernière mise à jour de la base : " + maj : "Base non synchronisée");
  const peutProposer = !!ADMIN || (window.Nova && Nova.peut("jonction"));
  $("#envoyer").disabled = off || !peutProposer;
  $("#envoyer").textContent = ADMIN ? "Enregistrer le paramètre" : "Proposer ce paramètre";
  $("#libAjout").textContent = ADMIN ? "Ajout" : "Proposer";
  $("#hors").style.display = (off || !peutProposer || !ADMIN) ? "block" : "none";
  $("#hors").textContent = off ? "Connexion requise pour enregistrer un paramètre." : !peutProposer ? MSG_ADMIN : "Tu n’es pas administrateur : ton paramètre sera envoyé comme proposition et validé par un administrateur.";
  const adm = !!ADMIN && window.Nova && Nova.peut("admin");
  $("#navProp").hidden = !adm;
}

async function synchro() {
  etat();
  if (!navigator.onLine) return;
  $("#etat").textContent += " · synchronisation…";
  try {
    // compte personnel : le code de consultation et le code administrateur sont differents, on interroge avec l'administrateur s'il est connu
    const essai = ADMIN || code();
    const r = await fetch(API_URL + "?code=" + encodeURIComponent(essai) + "&t=" + Date.now(), {cache: "no-store"});
    const j = await r.json();
    if (j.error === "code") {
      if (ADMIN) { ADMIN = ""; try { localStorage.removeItem("admin"); } catch (e) {} return synchro(); }
      CODE = ""; try { localStorage.removeItem("code"); } catch (e) {} $("#etat").textContent = "Code incorrect, rouvre l’appli."; return;
    }
    rows = j.rows;
    if (j.admin) { ADMIN = essai; try { localStorage.setItem("admin", essai); } catch (e) {} }
    else { ADMIN = ""; try { localStorage.removeItem("admin"); } catch (e) {} }
    maj = new Date().toLocaleString("fr-FR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
    localStorage.setItem("cache", JSON.stringify({rows, maj}));
  } catch (e) { /* on garde la copie locale */ }
  etat(); rendre();
}

function rendre() {
  const mats = [...new Set(rows.map(r => r.m))].sort(tri);
  MATS = mats;
  $("#l-m").innerHTML = mats.map(m => `<option value="${esc(m)}">`).join("");
  $("#l-p").innerHTML = [...new Set(rows.map(r => r.p))].sort(tri).map(p => `<option value="${esc(p)}">`).join("");
  cartes(); tableau(); majOutilUnites();
}

function suggerer() {
  const v = $("#matiere").value.trim().toLowerCase(), b = $("#sugg");
  const l = MATS.filter(m => String(m).toLowerCase().startsWith(v));
  b.innerHTML = l.map(m => `<button type="button" data-m="${esc(m)}">${esc(m)}</button>`).join("") ||
    '<p class="vide" style="margin:12px">Aucune matière ne commence par « ' + esc(v) + " ».</p>";
  b.style.display = "block";
}

function cartes() {
  const v = $("#matiere").value.trim().toLowerCase(), out = $("#resultats");
  const m = MATS.find(x => String(x).toLowerCase() === v);
  if (m === undefined) { out.innerHTML = '<p class="vide">' + (v ? "Choisis une matière dans la liste." : "Tape les premières lettres d’une matière.") + "</p>"; return; }
  const sel = rows.filter(r => r.m === m);
  const presses = [...new Set(sel.map(r => r.p))].sort(tri);
  out.innerHTML = presses.map(p => {
    const l = sel.filter(r => r.p === p).sort((a, b) => String(b.d).localeCompare(String(a.d)));
    return l.map((r, i) => `<div class="carte"><h2>${vide(p)}${l.length > 1 && i === 0 ? '<span class="tag">le plus récent</span>' : ""}</h2>
      <div class="grille">
        <div><span>Température supérieure</span><b>${vide(r.ts)}</b></div>
        <div><span>Température inférieure</span><b>${vide(r.ti)}</b></div>
        <div><span>Pression</span><b>${vide(r.pr)}</b></div>
        <div><span>Temps</span><b>${vide(tempsAffiche(r.t))}</b></div>
        <div class="pleine"><span>Accessoire</span><b>${vide(r.a)}</b></div>
        <div class="pleine"><span>Commentaire</span><b>${vide(r.c)}</b></div>
      </div><div class="pied">Validé le ${esc(dateFr(r.d)) || "—"}</div></div>`).join("");
  }).join("");
}

function tableau() {
  const q = $("#filtre").value.toLowerCase().trim();
  const l = rows.filter(r => !q || [r.m, r.p, r.a, r.c].join(" ").toLowerCase().includes(q))
                .sort((a, b) => tri(a.m, b.m) || tri(a.p, b.p));
  $("#table").innerHTML = "<tr><th>Matière</th><th>Presse</th><th>T° sup.</th><th>T° inf.</th><th>Pression</th><th>Temps</th><th>Accessoire</th><th>Commentaire</th><th>Date</th></tr>" +
    l.slice(0, 300).map(r => `<tr${r.n ? ' data-n="' + r.n + '"' : ""}><td>${vide(r.m)}</td><td>${vide(r.p)}</td><td>${vide(r.ts)}</td><td>${vide(r.ti)}</td><td>${vide(r.pr)}</td><td>${vide(tempsAffiche(r.t))}</td><td>${vide(r.a)}</td><td>${vide(r.c)}</td><td>${esc(dateFr(r.d))}</td></tr>`).join("");
  $("#compte").textContent = l.length + " ligne(s)" + (l.length > 300 ? " (300 affichées, affine le filtre)" : "");
}

const CH = [["m","Matière"],["p","Presse"],["ts","Température supérieure"],["ti","Température inférieure"],["pr","Pression"],["t","Temps"],["a","Accessoire"],["c","Commentaire"]];
let edN = null;

function codeAdmin() { return ADMIN; }

async function appel(payload) {
  const cle = codeAdmin();
  if (!cle) throw new Error("noadmin");
  const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({code:cle, ...payload})});
  const j = await r.json();
  if (j.error === "code") { ADMIN = ""; try { localStorage.removeItem("admin"); } catch (e) {} }
  return j;
}

function editer(n) {
  if (!navigator.onLine) { alert("Connexion requise pour corriger une ligne."); return; }
  const r = rows.find(x => x.n === n);
  if (!r) return;
  if (!ADMIN && !Nova.peut("jonction")) { alert(MSG_ADMIN); return; }
  edN = n;
  $("#dlg").innerHTML = "<h2 style='margin:0 0 4px;font-size:18px'>Corriger la ligne</h2>" +
    CH.map(([k, l]) => `<label for="e-${k}">${l}</label>` + (k === "c" ? `<textarea id="e-${k}" rows="3"></textarea>` : k === "t" ? '<div class="tps"><input id="e-t" inputmode="decimal"><select id="e-tu"><option value="">Unité ?</option><option value="s">secondes</option><option value="min">minutes</option></select></div>' : `<input id="e-${k}"${k === "m" ? ' list="l-m"' : k === "p" ? ' list="l-p"' : ""}>`)).join("") +
    '<button class="btn" id="e-ok">' + (ADMIN ? "Enregistrer la correction" : "Proposer cette modification") + '</button>' + (ADMIN ? '<button class="btn sup" id="e-sup">Supprimer la ligne</button>' : "") + '<button class="btn sec" id="e-non">Annuler</button><div id="e-retour" class="pied"></div>';
  CH.forEach(([k]) => { if (k !== "t") $("#e-" + k).value = k === "m" ? String(r[k] ?? "").toUpperCase() : (r[k] ?? ""); });
  { const t = tempsLire(r.t); $("#e-t").value = t.val; $("#e-tu").value = t.unite || (t.libre || !t.val ? "" : "min"); }
  $("#e-ok").onclick = () => corriger(false);
  if (ADMIN) $("#e-sup").onclick = () => corriger(true);
  $("#e-non").onclick = () => $("#dlg").close();
  $("#dlg").showModal();
}

async function corriger(suppr) {
  const r = rows.find(x => x.n === edN), info = $("#e-retour");
  const data = {}; CH.forEach(([k]) => data[k] = $("#e-" + k).value.trim()); data.m = data.m.toUpperCase();
  if (!suppr && tempsManque(data.t, $("#e-tu").value)) { info.textContent = "Choisis l’unité du temps : secondes ou minutes."; return; }
  data.t = tempsFormat(data.t, $("#e-tu").value);
  if (!suppr && (!data.m || !data.p)) { info.textContent = "La matière et la presse sont obligatoires."; return; }
  if (!ADMIN) {
    const ancien = {}; CH.forEach(([k]) => ancien[k] = String(r[k] ?? "").trim());
    const canon = t => { const x = tempsLire(t); return x.libre ? String(t ?? "").trim() : x.val + " " + (x.unite || "min"); };
    if (CH.every(([k]) => k === "t" ? canon(ancien.t) === canon(data.t) : (k === "m" ? ancien[k].toUpperCase() : ancien[k]) === data[k])) { info.textContent = "Rien n’a changé."; return; }
    info.textContent = "Envoi…";
    try {
      await Nova.api("jonctionPropose", {prop: {type: "modif", n: edN, ancien, nouveau: data}}, 30000);
      $("#dlg").close(); alert("Proposition envoyée : un administrateur va l’examiner.");
    } catch (e) { info.textContent = "Échec de l’envoi : " + e.message; }
    return;
  }
  if (suppr && !confirm("Supprimer définitivement cette ligne ?")) return;
  info.textContent = "Enregistrement…";
  try {
    const j = await appel({action: suppr ? "delete" : "edit", row: edN, orig: {m: r.m, p: r.p}, data});
    if (!j.ok) throw new Error(j.error);
    $("#dlg").close(); await synchro();
  } catch (e) {
    info.textContent = e.message === "noadmin" ? MSG_ADMIN : e.message === "code" ? "Le code administrateur n’est plus valide : reconnecte-toi depuis l’accueil avec le code administrateur." : e.message === "obsolete" ? "Cette ligne a changé entre-temps : ferme la fenêtre, l’appli va se resynchroniser." : "Échec. Vérifie la connexion et réessaie.";
    if (e.message === "obsolete") synchro();
  }
}

/* Outil administrateur : les anciennes fiches ont un temps sans unité (ex. « 3 ») ; on les enregistre en minutes (« 3 min »)
   sans toucher aux autres valeurs. Les fiches déjà corrigées en secondes ou en minutes ne sont pas modifiées. */
// Forme propre : « 45 s » ou « 5 min » (nombre, espace, unité en minuscules). Sans unité = minutes.
function formeCorrecte(t) { return t.val + " " + (t.unite || "min"); }
function sansUnite() { return rows.filter(r => { const t = tempsLire(r.t); return !t.libre && t.val && String(r.t).trim() !== formeCorrecte(t); }); }
function tempsLibres() { return rows.filter(r => { const t = tempsLire(r.t); return t.libre && t.val; }); }
function majOutilUnites() {
  const n = sansUnite().length, l = tempsLibres().length;
  const info = $("#infoUnites"), bt = $("#btnUnites");
  const version = " (page 2026-11-24-a, " + rows.length + " fiches lues)";
  $("#outilUnites").hidden = !(ADMIN && (n > 0 || l > 0));   // cadre visible seulement s'il y a quelque chose à faire
  if (!ADMIN) { info.textContent = "Réservé à l’administrateur : déconnecte-toi puis reconnecte-toi depuis l’accueil avec le code administrateur de la jonction." + version; bt.hidden = true; return; }
  bt.hidden = n === 0;
  info.textContent = (n ? n + " fiche" + (n > 1 ? "s ont" : " a") + " un temps à remettre au même format (« 45 s » ou « 5 min » : majuscules, SEC, MIN, sans espace, sans unité…). Les valeurs ne changent pas ; sans unité = minutes." : "Tous les temps sont déjà au bon format.") + (l ? " " + l + " fiche" + (l > 1 ? "s ont" : " a") + " un temps en texte libre (ex. « 1h30 ») : non modifiée" + (l > 1 ? "s" : "") + "." : "") + version;
}
let unitesEnCours = false;
async function initialiserUnites() {
  if (unitesEnCours) return;
  const liste = sansUnite();
  if (!liste.length) return;
  if (!confirm("Remettre " + liste.length + " temps au format « 45 s » / « 5 min » ? Les valeurs ne changent pas (sans unité = minutes), les autres champs non plus.")) return;
  unitesEnCours = true; $("#btnUnites").disabled = true;
  const av = $("#avanceUnites"); let fait = 0;
  try {
    for (const r of liste) {
      av.textContent = "Enregistrement… " + fait + " / " + liste.length + " (ne ferme pas la page)";
      const t = tempsLire(r.t);
      const data = {}; CH.forEach(([k]) => data[k] = String(r[k] ?? "").trim());
      data.t = formeCorrecte(t);
      const j = await appel({action: "edit", row: r.n, orig: {m: r.m, p: r.p}, data});
      if (!j.ok) throw new Error(j.error === "noadmin" ? MSG_ADMIN : (j.error || "erreur"));
      r.t = data.t; fait++;
      await new Promise(x => setTimeout(x, 250));
    }
    av.textContent = fait + " fiche" + (fait > 1 ? "s" : "") + " mise" + (fait > 1 ? "s" : "") + " au même format.";
  } catch (e) {
    av.textContent = "Arrêt après " + fait + " / " + liste.length + " : " + (e.message === "noadmin" ? MSG_ADMIN : e.message) + ". Relance le bouton pour continuer (les fiches déjà faites sont ignorées).";
  }
  unitesEnCours = false; $("#btnUnites").disabled = false;
  await synchro();
}
$("#btnUnites").onclick = initialiserUnites;

async function envoyer() {
  const g = id => $("#f-" + id).value.trim();
  const data = {m:g("m").toUpperCase(), p:g("p"), ts:g("ts"), ti:g("ti"), pr:g("pr"), t:g("t"), a:g("a"), c:g("c")};
  if (tempsManque(data.t, $("#f-tu").value)) { $("#retour").innerHTML = '<div class="msg">Choisis l’unité du temps : secondes ou minutes.</div>'; return; }
  data.t = tempsFormat(data.t, $("#f-tu").value);
  const retour = $("#retour");
  if (!data.m || !data.p) { retour.innerHTML = '<div class="msg">La matière et la presse sont obligatoires.</div>'; return; }
  $("#envoyer").disabled = true; retour.innerHTML = '<div class="msg">Enregistrement…</div>';
  if (!ADMIN) {
    try {
      await Nova.api("jonctionPropose", {prop: {type: "nouveau", nouveau: data}}, 30000);
      ["m","p","ts","ti","pr","t","a","c"].forEach(i => $("#f-" + i).value = "");
      $("#f-tu").value = "";
      retour.innerHTML = '<div class="msg">Proposition envoyée : un administrateur va l’examiner.</div>';
    } catch (e) { retour.innerHTML = '<div class="msg">Échec de l’envoi : ' + esc(e.message) + "</div>"; }
    etat(); return;
  }
  try {
    const j = await appel({action:"add", data});
    if (!j.ok) throw new Error(j.error);
    ["m","p","ts","ti","pr","t","a","c"].forEach(i => $("#f-" + i).value = "");
    $("#f-tu").value = "";
    retour.innerHTML = '<div class="msg">Paramètre enregistré.</div>';
    const nouvelle = {n: 0, ...data, d: new Date().toISOString().slice(0, 10)};
    ["m", "p"].forEach(k => { const f = rows.find(x => norm(x[k]) === norm(nouvelle[k])); if (f) nouvelle[k] = f[k]; });
    rows.push(nouvelle);
    try { localStorage.setItem("cache", JSON.stringify({rows, maj})); } catch (e) {}
    rendre();
    synchro();
  } catch (e) {
    retour.innerHTML = '<div class="msg">' + (e.message === "noadmin" ? MSG_ADMIN : e.message === "code" ? "Le code administrateur n’est plus valide : reconnecte-toi depuis l’accueil avec le code administrateur." : "Échec de l’enregistrement. Vérifie la connexion et réessaie.") + "</div>";
  }
  etat();
}

/* Matière (référence) : toujours en majuscules, à la saisie, à la correction et dans les propositions */
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id !== "f-m" && t.id !== "e-m") return;
  const a = t.selectionStart, b = t.selectionEnd, u = t.value.toUpperCase();
  if (u !== t.value) { t.value = u; try { t.setSelectionRange(a, b); } catch (x) {} }
});

/* ---------- Propositions (administrateurs) ---------- */
let PROPS = [];
const estAdmin = () => !!ADMIN && window.Nova && Nova.peut("admin");
function ligneProp(p) {
  const nou = p.nouveau || {}, anc = p.ancien;
  const lignes = CH.map(([k, l]) => {
    const n = k === "t" ? tempsAffiche(nou[k]) : nou[k], a = anc ? (k === "t" ? tempsAffiche(anc[k]) : anc[k]) : "";
    const change = anc ? String(n ?? "") !== String(a ?? "") : !!n;
    return `<tr><th>${l}</th><td${change ? ' class="chg"' : ""}>${anc && change ? '<span class="anc">' + vide(a) + "</span> → " : ""}${vide(n)}</td></tr>`;
  }).join("");
  const d = (p.date || "").slice(0, 10);
  return `<div class="prop" data-id="${esc(p.id)}"><h3>${p.type === "modif" ? "Modification d’une fiche" : "Nouveau paramètre"}</h3>
    <div class="qui">Proposé par ${esc(p.auteur)}${d ? " le " + esc(dateFr(d)) : ""}</div><table>${lignes}</table>
    <div class="acts"><button class="btn" data-a="ok">Valider</button><button class="btn sec" data-a="cor">Corriger</button><button class="btn sup" data-a="no">Refuser</button></div>
    <div class="pied" data-r></div></div>`;
}
function dessinerProps(msg) {
  $("#listeProp").innerHTML = (msg ? '<div class="msg">' + esc(msg) + "</div>" : "") + (PROPS.length ? PROPS.map(ligneProp).join("") : '<p class="vide">Aucune proposition en attente.</p>');
  const nb = $("#navPast"); nb.hidden = !PROPS.length; nb.textContent = PROPS.length;
}
async function chargerProps(msg) {
  if (!estAdmin() || !navigator.onLine) return;
  try { PROPS = (await Nova.api("jonctionPropositions", null, 15000)).propositions || []; dessinerProps(msg); } catch (e) { /* on garde l'affichage */ }
}
function mess(id, t) { const e = document.querySelector('.prop[data-id="' + id + '"] [data-r]'); if (e) e.textContent = t; }
async function traiter(id, data) {
  const p = PROPS.find(x => x.id === id); if (!p) return;
  if (!ADMIN) { mess(id, MSG_ADMIN); return; }
  mess(id, "Traitement…");
  try { await Nova.api("jonctionPrendre", {id}, 20000); }
  catch (e) { await chargerProps(e.code === "deja" ? "Cette proposition a déjà été traitée par un autre administrateur." : "Échec : " + e.message); return; }
  const fin = data || {...p.nouveau}; fin.m = String(fin.m || "").toUpperCase();
  fin.t = tempsFormat(tempsAffiche(fin.t), "") || fin.t;
  try {
    const j = p.type === "modif" ? await appel({action:"edit", row: p.n, orig: {m: p.ancien.m, p: p.ancien.p}, data: fin}) : await appel({action:"add", data: fin});
    if (!j.ok) throw new Error(j.error === "obsolete" ? "la fiche a changé entre-temps" : (j.error || "erreur"));
  } catch (e) {
    try { await Nova.api("jonctionFinir", {id, issue: "rouvrir"}, 20000); } catch (x) {}
    await chargerProps("Non enregistrée dans la base (" + (e.message === "noadmin" ? MSG_ADMIN : e.message) + "). La proposition reste en attente.");
    synchro(); return;
  }
  try { await Nova.api("jonctionFinir", {id, issue: "validee", data: fin}, 20000); } catch (e) {}
  await chargerProps("Proposition validée et enregistrée dans la base.");
  synchro();
}
async function refuser(id) {
  if (!confirm("Refuser cette proposition ?")) return;
  try { await Nova.api("jonctionFinir", {id, issue: "refusee"}, 20000); await chargerProps("Proposition refusée."); }
  catch (e) { await chargerProps(e.code === "deja" ? "Cette proposition a déjà été traitée par un autre administrateur." : "Échec : " + e.message); }
}
function corrigerProp(id) {
  const p = PROPS.find(x => x.id === id); if (!p) return;
  $("#dlg").innerHTML = "<h2 style='margin:0 0 4px;font-size:18px'>Corriger avant de valider</h2>" +
    CH.map(([k, l]) => `<label for="e-${k}">${l}</label>` + (k === "c" ? `<textarea id="e-${k}" rows="3"></textarea>` : k === "t" ? '<div class="tps"><input id="e-t" inputmode="decimal"><select id="e-tu"><option value="">Unité ?</option><option value="s">secondes</option><option value="min">minutes</option></select></div>' : `<input id="e-${k}"${k === "m" ? ' list="l-m"' : k === "p" ? ' list="l-p"' : ""}>`)).join("") +
    '<button class="btn" id="e-ok">Valider avec ces corrections</button><button class="btn sec" id="e-non">Annuler</button><div id="e-retour" class="pied"></div>';
  CH.forEach(([k]) => { if (k !== "t") $("#e-" + k).value = k === "m" ? String(p.nouveau[k] ?? "").toUpperCase() : (p.nouveau[k] ?? ""); });
  { const t = tempsLire(p.nouveau.t); $("#e-t").value = t.val; $("#e-tu").value = t.unite || (t.libre || !t.val ? "" : "min"); }
  $("#e-non").onclick = () => $("#dlg").close();
  $("#e-ok").onclick = () => {
    const data = {}; CH.forEach(([k]) => data[k] = $("#e-" + k).value.trim()); data.m = data.m.toUpperCase();
    if (tempsManque(data.t, $("#e-tu").value)) { $("#e-retour").textContent = "Choisis l’unité du temps : secondes ou minutes."; return; }
    data.t = tempsFormat(data.t, $("#e-tu").value);
    if (!data.m || !data.p) { $("#e-retour").textContent = "La matière et la presse sont obligatoires."; return; }
    $("#dlg").close(); traiter(id, data);
  };
  $("#dlg").showModal();
}
$("#listeProp").onclick = e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const id = b.closest(".prop").dataset.id;
  if (b.dataset.a === "ok") traiter(id); else if (b.dataset.a === "cor") corrigerProp(id); else refuser(id);
};

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button, section").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); $("#" + b.dataset.s).classList.add("on");
});
$("#matiere").oninput = () => { suggerer(); cartes(); };
$("#matiere").onfocus = e => { e.target.select(); suggerer(); };
$("#matiere").onkeydown = e => { if (e.key === "Enter") { $("#sugg").style.display = "none"; e.target.blur(); } };
$("#sugg").onclick = e => {
  const b = e.target.closest("button[data-m]"); if (!b) return;
  $("#matiere").value = b.dataset.m; $("#sugg").style.display = "none"; cartes();
};
document.addEventListener("click", e => { if (!e.target.closest("#matiere, #sugg")) $("#sugg").style.display = "none"; });
$("#filtre").oninput = tableau;
$("#envoyer").onclick = envoyer;
$("#table").onclick = e => { const tr = e.target.closest("tr[data-n]"); if (tr) editer(+tr.dataset.n); };
addEventListener("online", synchro);
addEventListener("offline", etat);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { synchro(); chargerProps(); } });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
rendre(); synchro(); etat(); chargerProps();
</script>
<script src="shell.js"></script>
</body>
</html>
