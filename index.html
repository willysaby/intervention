<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bon d'intervention</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Arial, sans-serif; background: #f2f4f7; margin: 0; padding: 12px; color: #222; }
  .carte { background: #fff; max-width: 720px; margin: 0 auto 14px; padding: 16px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .numero { color: #0b5cff; font-weight: 700; font-size: 18px; }
  .entete { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .entete img { max-height: 56px; max-width: 40%; object-fit: contain; }
  #noteLogo { font-size: 12px; color: #8a1c1c; margin-top: 4px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 14px; }
  input, select, textarea { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #c8cdd4; border-radius: 8px; background: #fff; }
  .ligne { display: flex; gap: 8px; }
  .ligne > div { flex: 1; }
  .bande { border: 1px dashed #b5bcc6; border-radius: 10px; padding: 10px; margin-top: 10px; position: relative; }
  .bande .titre { font-weight: 700; font-size: 13px; color: #555; }
  .suppr { position: absolute; top: 6px; right: 8px; background: none; border: none; color: #d33; font-size: 20px; }
  button.plus { width: 100%; margin-top: 10px; padding: 12px; font-size: 16px; border: 2px solid #0b5cff; color: #0b5cff; background: #fff; border-radius: 8px; font-weight: 700; }
  canvas { width: 100%; height: 180px; border: 1px solid #c8cdd4; border-radius: 8px; touch-action: none; background: #fff; }
  button.eff { margin-top: 6px; padding: 8px 12px; border: 1px solid #c8cdd4; background: #fff; border-radius: 8px; }
  button.valider { width: 100%; padding: 16px; font-size: 18px; font-weight: 700; color: #fff; background: #0b9d58; border: none; border-radius: 10px; }
  button:disabled { opacity: .5; }
  #message { text-align: center; margin-top: 10px; font-weight: 600; }
  #attente { display: none; max-width: 720px; margin: 0 auto 14px; padding: 12px 16px; background: #fff3cd; border: 1px solid #e0b100; border-radius: 12px; text-align: center; font-weight: 600; }
  #attente button { margin-top: 8px; padding: 10px 14px; font-size: 15px; font-weight: 700; border: none; border-radius: 8px; background: #e0b100; color: #fff; }
  #erreurAttente { font-weight: 500; font-size: 13px; color: #8a1c1c; margin-top: 6px; }
  #infoHaut { display: none; max-width: 720px; margin: 0 auto 14px; padding: 10px 16px; border-radius: 12px; text-align: center; font-weight: 600; }
  #infoHaut.ok { background: #d8f3e3; color: #0b6b3a; }
  #infoHaut.ko { background: #fde2e2; color: #8a1c1c; }
  #statutReseau { max-width: 720px; margin: 0 auto 10px; text-align: right; font-size: 13px; font-weight: 600; }
  .enligne { color: #0b9d58; } .horsligne { color: #d33; }
  .listeTech { border: 1px solid #c8cdd4; border-radius: 8px; padding: 4px 12px; }
  .listeTech label.tech { display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 17px; margin: 0; padding: 12px 0; border-bottom: 1px solid #eee; }
  .listeTech label.tech:last-child { border-bottom: none; }
  .listeTech input[type=checkbox] { width: 26px; height: 26px; padding: 0; flex: none; }
  .horaire { display: flex; gap: 6px; align-items: center; }
  .horaire select { flex: 1; min-width: 0; }
  .horaire span { font-weight: 700; }
  .erreurTech { color: #d33; font-weight: 600; font-size: 14px; padding: 10px 0; }
  .erreurTech button { margin-top: 8px; padding: 8px 12px; font-size: 15px; border: 1px solid #c8cdd4; background: #fff; border-radius: 8px; color: #222; }
</style>
</head>
<body>

<div id="statutReseau"></div>
<div id="attente">
  <span id="texteAttente"></span><br>
  <div id="erreurAttente"></div>
  <button id="btnRenvoi" onclick="envoyerEnAttente(true)">Renvoyer les bons en attente</button>
</div>
<div id="infoHaut"></div>

<div class="carte">
  <div class="entete">
    <div>
      <h1>Bon d'intervention</h1>
      <div class="numero" id="numero">N° ...</div>
    </div>
    <img id="logo" alt="Logo" style="display:none">
  </div>
  <div id="noteLogo"></div>
  <label>N° de commande</label><input id="numeroCommande" placeholder="N° de commande">
  <label>Date</label><input id="date" readonly>
  <div class="ligne">
    <div><label>Heure d'arrivée</label><div class="horaire"><select id="arriveeH"></select><span>h</span><select id="arriveeM"></select></div></div>
    <div><label>Heure de fin</label><div class="horaire"><select id="finH"></select><span>h</span><select id="finM"></select></div></div>
  </div>
  <label>Nom du client</label><input id="client" placeholder="Nom du client">
  <label>Techniciens présents</label><div id="techniciens" class="listeTech"></div>
</div>

<div class="carte">
  <b>Bandes</b>
  <div id="bandes"></div>
  <button class="plus" onclick="ajouterBande()">+ Ajouter une bande</button>
</div>

<div class="carte">
  <label>Commentaire</label><textarea id="commentaire" rows="5"></textarea>
</div>

<div class="carte">
  <label>Signature du client</label>
  <canvas id="sign"></canvas>
  <button class="eff" onclick="effacerSignature()">Effacer la signature</button>
  <label>Email du client (pour recevoir le bon)</label>
  <input type="email" id="emailClient" placeholder="client@exemple.fr">
</div>

<div class="carte">
  <button class="valider" id="btnValider" onclick="valider()">Valider et envoyer</button>
  <div id="message"></div>
</div>

<script>
const URL_API = 'https://script.google.com/macros/s/AKfycbyXhzm5EhNrwwErKeY6ngczgfZDfmbWbP67gJ7f01dLvPoT3JZV55Ofq0QubpFyta_r/exec';
const CLE_ATTENTE = 'bonsEnAttente';
const CLE_TECHNICIENS = 'techniciensMemorises';
const CLE_LOGO = 'logoMemorise';
const COMMENTAIRE_DEFAUT = 'Intervention sur site pour la mise en longueur + jonction + réglage bande client. A contrôler en production';
const DELAI_MAX_MS = 90000;

function aujourdhui() {
  return new Date().toLocaleDateString('fr-FR');
}

function creerErreur(type, message) {
  const e = new Error(message);
  e.type = type;
  return e;
}

/* ---------- Envoi d'un bon au script Apps Script ---------- */
async function posterBon(donnees) {
  const ctrl = new AbortController();
  const minuteur = setTimeout(() => ctrl.abort(), DELAI_MAX_MS);
  let r;
  try {
    r = await fetch(URL_API, { method: 'POST', body: JSON.stringify(donnees), signal: ctrl.signal });
  } catch (e) {
    throw creerErreur('reseau', 'Le script n\'a pas répondu (réseau coupé, URL incorrecte ou accès non réglé sur « Tout le monde »).');
  } finally {
    clearTimeout(minuteur);
  }
  let res;
  try {
    res = await r.json();
  } catch (e) {
    throw creerErreur('serveur', 'Réponse inattendue du script (autorisations à accorder ou nouvelle version à déployer dans Apps Script).');
  }
  if (!res.ok) throw creerErreur('serveur', res.erreur || 'Erreur du script.');
  return res;
}

/* ---------- Stockage hors ligne ---------- */
function lireAttente() {
  try { return JSON.parse(localStorage.getItem(CLE_ATTENTE)) || []; }
  catch (e) { return []; }
}
function ecrireAttente(liste) {
  localStorage.setItem(CLE_ATTENTE, JSON.stringify(liste));
  afficherAttente();
}
function afficherAttente() {
  const liste = lireAttente();
  const n = liste.length;
  document.getElementById('attente').style.display = n > 0 ? 'block' : 'none';
  document.getElementById('texteAttente').textContent =
    n + (n > 1 ? ' bons en attente d\'envoi' : ' bon en attente d\'envoi');
  const erreurs = liste.map(b => b.erreur).filter(Boolean);
  const derniere = erreurs.length ? erreurs[erreurs.length - 1] : '';
  document.getElementById('erreurAttente').textContent = derniere ? 'Dernière erreur : ' + derniere : '';
}
function afficherStatutReseau() {
  const el = document.getElementById('statutReseau');
  if (navigator.onLine) { el.textContent = 'En ligne'; el.className = 'enligne'; }
  else { el.textContent = 'Hors ligne – les bons seront gardés sur l\'appareil'; el.className = 'horsligne'; }
}
function infoHaut(texte, ok) {
  const el = document.getElementById('infoHaut');
  el.textContent = texte;
  el.className = ok ? 'ok' : 'ko';
  el.style.display = texte ? 'block' : 'none';
}

/* ---------- Envoi des bons en attente ---------- */
let envoiEnCours = false;
async function envoyerEnAttente(manuel) {
  if (envoiEnCours) return;
  if (!navigator.onLine) {
    if (manuel) infoHaut('Toujours hors ligne : le bon reste sur l\'appareil.', false);
    return;
  }
  envoiEnCours = true;
  const btn = document.getElementById('btnRenvoi');
  btn.disabled = true;
  if (manuel) infoHaut('Envoi en cours...', true);
  let envoyes = 0;
  for (const bon of lireAttente()) {
    try {
      await posterBon(bon.donnees);
      ecrireAttente(lireAttente().filter(b => b.id !== bon.id));
      envoyes++;
    } catch (e) {
      const liste = lireAttente();
      const cible = liste.find(b => b.id === bon.id);
      if (cible) { cible.erreur = e.message; ecrireAttente(liste); }
      if (manuel) infoHaut('Échec de l\'envoi : ' + e.message, false);
      break;
    }
  }
  envoiEnCours = false;
  btn.disabled = false;
  if (envoyes > 0) {
    infoHaut(envoyes + (envoyes > 1 ? ' bons envoyés' : ' bon envoyé') + ' !', true);
    setTimeout(() => infoHaut('', true), 8000);
  }
}

/* ---------- Initialisation ---------- */
async function init() {
  document.getElementById('date').value = aujourdhui();
  document.getElementById('commentaire').value = COMMENTAIRE_DEFAUT;
  remplirHoraires();
  afficherLogoMemorise();
  ajouterBande();
  afficherAttente();
  afficherStatutReseau();
  await chargerDonnees();
  envoyerEnAttente(false);
}

async function chargerDonnees() {
  document.getElementById('techniciens').innerHTML = '<div class="erreurTech" style="color:#555">Chargement...</div>';
  try {
    const r = await fetch(URL_API);
    const d = await r.json();
    if (d.erreur) throw new Error(d.erreur);
    localStorage.setItem(CLE_TECHNICIENS, JSON.stringify(d.techniciens));
    document.getElementById('numero').textContent = 'N° ' + d.numero;
    afficherLogo(d.logo, d.logoErreur);
    remplirTechniciens(d.techniciens);
  } catch (e) {
    let memo = [];
    try { memo = JSON.parse(localStorage.getItem(CLE_TECHNICIENS) || '[]'); } catch (x) {}
    document.getElementById('numero').textContent = 'N° attribué à l\'envoi';
    if (memo.length > 0) remplirTechniciens(memo);
    else afficherErreurTech(e);
  }
}

/* ---------- Logo (vient de Drive via le script) ---------- */
function afficherLogo(dataUrl, erreur) {
  const img = document.getElementById('logo');
  const note = document.getElementById('noteLogo');
  if (dataUrl) {
    img.src = dataUrl;
    img.style.display = '';
    note.textContent = '';
    try { localStorage.setItem(CLE_LOGO, dataUrl); } catch (e) {}
  } else {
    img.style.display = 'none';
    note.textContent = erreur ? 'Logo non chargé : ' + erreur : '';
    try { localStorage.removeItem(CLE_LOGO); } catch (e) {}
  }
}
function afficherLogoMemorise() {
  try {
    const m = localStorage.getItem(CLE_LOGO);
    if (m) {
      const img = document.getElementById('logo');
      img.src = m;
      img.style.display = '';
    }
  } catch (e) {}
}

function afficherErreurTech(e) {
  const brut = e instanceof TypeError || e instanceof SyntaxError || !e || !e.message;
  const detail = brut
    ? 'Impossible de joindre le script Apps Script. Vérifie l\'URL (elle doit finir par /exec) et que l\'accès du déploiement est sur « Tout le monde ».'
    : e.message;
  document.getElementById('techniciens').innerHTML =
    '<div class="erreurTech"><div>Liste des techniciens non chargée.</div><div id="detailErreur"></div>' +
    '<button onclick="chargerDonnees()">Réessayer</button></div>';
  document.getElementById('detailErreur').textContent = detail;
}

function remplirTechniciens(liste) {
  const zone = document.getElementById('techniciens');
  if (!liste || liste.length === 0) {
    zone.innerHTML = '<div class="erreurTech">Aucun technicien trouvé (noms attendus en colonne A, à partir de la ligne 2).</div>';
    return;
  }
  zone.innerHTML = liste.map(t => {
    const nom = String(t);
    return '<label class="tech"><input type="checkbox" value="' + nom.replace(/"/g, '&quot;') + '"><span>' + nom + '</span></label>';
  }).join('');
}

/* ---------- Heures (pas de 15 minutes) ---------- */
function remplirHoraires() {
  ['arrivee', 'fin'].forEach(p => {
    const h = document.getElementById(p + 'H');
    const m = document.getElementById(p + 'M');
    let opts = '<option value="">--</option>';
    for (let i = 0; i < 24; i++) {
      const v = String(i).padStart(2, '0');
      opts += '<option value="' + v + '">' + v + '</option>';
    }
    h.innerHTML = opts;
    m.innerHTML = ['00', '15', '30', '45'].map(v => '<option value="' + v + '">' + v + '</option>').join('');
  });
}
function lireHoraire(p) {
  const h = document.getElementById(p + 'H').value;
  return h ? h + ':' + document.getElementById(p + 'M').value : '';
}

/* ---------- Bandes ---------- */
function ajouterBande() {
  const div = document.createElement('div');
  div.className = 'bande';
  div.innerHTML =
    '<div class="titre"></div><button class="suppr" onclick="supprimerBande(this)">×</button>' +
    '<label>Matière</label><input class="matiere">' +
    '<div class="ligne"><div><label>Largeur</label><input class="largeur"></div>' +
    '<div><label>Longueur</label><input class="longueur"></div></div>';
  document.getElementById('bandes').appendChild(div);
  renumeroter();
}

function supprimerBande(btn) {
  if (document.querySelectorAll('.bande').length > 1) {
    btn.parentElement.remove();
    renumeroter();
  }
}

function renumeroter() {
  document.querySelectorAll('.bande .titre').forEach((t, i) => t.textContent = 'Bande ' + (i + 1));
}

/* ---------- Signature ---------- */
const canvas = document.getElementById('sign');
const ctx = canvas.getContext('2d');
let dessine = false, aSigne = false;

function ajusterCanvas() {
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width * 2; canvas.height = r.height * 2;
  ctx.scale(2, 2); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
}
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener('pointerdown', e => { dessine = true; aSigne = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
canvas.addEventListener('pointermove', e => { if (!dessine) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
window.addEventListener('pointerup', () => dessine = false);
function effacerSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); aSigne = false; }

/* ---------- Validation ---------- */
async function valider() {
  const msg = document.getElementById('message');
  const client = document.getElementById('client').value.trim();
  const technicien = [...document.querySelectorAll('#techniciens input:checked')].map(c => c.value).join(', ');
  const emailClient = document.getElementById('emailClient').value.trim();
  if (!client || !technicien || !emailClient) { msg.textContent = 'Client, au moins un technicien et email sont obligatoires.'; return; }
  if (!aSigne) { msg.textContent = 'La signature du client est obligatoire.'; return; }

  const bandes = [...document.querySelectorAll('.bande')].map(b => ({
    matiere: b.querySelector('.matiere').value,
    largeur: b.querySelector('.largeur').value,
    longueur: b.querySelector('.longueur').value
  }));

  const donnees = {
    idEnvoi: 'B' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    date: aujourdhui(), client, technicien, emailClient, bandes,
    numeroCommande: document.getElementById('numeroCommande').value.trim(),
    commentaire: document.getElementById('commentaire').value,
    heureArrivee: lireHoraire('arrivee'),
    heureFin: lireHoraire('fin'),
    signature: canvas.toDataURL('image/png')
  };

  const btn = document.getElementById('btnValider');
  btn.disabled = true; msg.textContent = 'Envoi en cours...';

  if (!navigator.onLine) { garderEnAttente(donnees, 'Pas de connexion Internet.'); return; }

  try {
    const res = await posterBon(donnees);
    msg.textContent = 'Bon ' + res.numero + ' envoyé !';
    setTimeout(() => location.reload(), 2500);
  } catch (e) {
    garderEnAttente(donnees, e.message);
  }
}

function garderEnAttente(donnees, raison) {
  const liste = lireAttente();
  liste.push({ id: donnees.idEnvoi, donnees: donnees, erreur: raison || '' });
  try {
    ecrireAttente(liste);
  } catch (e) {
    document.getElementById('message').textContent = 'Mémoire pleine : impossible de garder le bon. Envoie-le dès que possible.';
    document.getElementById('btnValider').disabled = false;
    return;
  }
  document.getElementById('message').textContent =
    'Envoi impossible pour le moment : bon gardé sur l\'appareil. ' + (raison || '');
  setTimeout(() => location.reload(), 6000);
}

/* ---------- Événements réseau ---------- */
window.addEventListener('online', () => { afficherStatutReseau(); envoyerEnAttente(false); });
window.addEventListener('offline', afficherStatutReseau);

window.addEventListener('load', () => { ajusterCanvas(); init(); });
</script>
</body>
</html>
