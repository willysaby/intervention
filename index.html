<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Arial, sans-serif; background: #f2f4f7; color: #222; }
  .page { max-width: 520px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 24px; }
  #logo { max-height: 48px; max-width: 45%; object-fit: contain; }
  .badge { display: inline-block; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; background: #e3e6ea; color: #555; margin-top: 6px; }
  .badge.user { background: #dbeafe; color: #1d4ed8; }
  .badge.admin { background: #fde68a; color: #92400e; }
  .carte { display: block; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 16px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #c8cdd4; border-radius: 8px; }
  button.principal { width: 100%; margin-top: 10px; padding: 14px; font-size: 17px; font-weight: 700; color: #fff; background: #0b5cff; border: none; border-radius: 10px; }
  button.secondaire { width: 100%; padding: 10px; font-size: 15px; background: #fff; border: 1px solid #c8cdd4; border-radius: 10px; color: #444; }
  button:disabled { opacity: .55; }
  #message { margin-top: 8px; font-weight: 600; font-size: 14px; color: #b42318; min-height: 1em; }
  .module { display: block; width: 100%; padding: 18px; margin-bottom: 12px; border: none; border-radius: 14px; background: #0e9062; color: #fff; font-size: 20px; font-weight: 700; text-align: left; }
  .module small { display: block; margin-top: 3px; font-size: 13px; font-weight: 500; opacity: .9; }
  .module:disabled { background: #c9ced6; color: #7b8490; opacity: 1; }
  #consigne { text-align: center; color: #666; font-size: 14px; margin: 0 0 12px; }

<script src="config.js"></script>
<script>
const CFG = window.CONFIG || {};
const URL_AUTH = CFG.URL_AUTH || '';
const CLE_SESSION = 'sessionAccueil';
const DUREE_SESSION_H = 12;
const LIBELLES = { user: 'Utilisateur', admin: 'Administrateur' };
const RANG = { user: 1, admin: 2 };

// Boutons de l'accueil. Pour en ajouter un : copier une ligne.
// fichier  : page hébergée ici ; secours : adresse utilisée tant que ce fichier n'existe pas
// niveauMin : 'user' (tout le monde) ou 'admin' (administrateurs seulement)
const MODULES = [
  { titre: 'Jonction', description: 'Application Jonction', fichier: 'jonction.html',
    secours: 'https://willysaby.github.io/jonction/', niveauMin: 'user' },
  { titre: 'Bon d\'intervention', description: 'Saisie des bons sur site', fichier: 'intervention.html',
    niveauMin: 'user' }
];

let niveau = null;

/* ---------- Session (garde le niveau quelques heures sur l'appareil) ---------- */
function lireSession() {
  try {
    const s = JSON.parse(localStorage.getItem(CLE_SESSION));
    if (s && RANG[s.niveau] && s.expire > Date.now()) return s.niveau;
  } catch (e) {}
  return null;
}
function ecrireSession(n) {
  try {
    localStorage.setItem(CLE_SESSION, JSON.stringify({ niveau: n, expire: Date.now() + DUREE_SESSION_H * 3600 * 1000 }));
  } catch (e) {}
}
function effacerSession() {
  try { localStorage.removeItem(CLE_SESSION); } catch (e) {}
}

/* ---------- Vérification du mot de passe ---------- */
// Script Apps Script de Jonction, utilisé tel quel (aucune modification) :
// il répond { rows: [...], admin: true } avec le code administrateur,
// { rows: [...], admin: false } avec le code de l'équipe, et { error: "code" } si le code est faux.
async function verifierMotDePasse(mdp) {
  let r;
  try {
    r = await fetch(URL_AUTH + '?code=' + encodeURIComponent(mdp) + '&t=' + Date.now(), { cache: 'no-store' });
  } catch (e) {
    throw new Error('serveur injoignable (réseau ou accès au script).');
  }
  try {
    return await r.json();
  } catch (e) {
    throw new Error('réponse inattendue du script de connexion.');
  }
}

function lireNiveau(res) {
  if (!res || res.error || !Array.isArray(res.rows)) return null;
  return res.admin ? 'admin' : 'user';
}

// Jonction garde le code dans le téléphone (clés "code" et "admin") : on les renseigne aussi
// pour qu'il s'ouvre déjà connecté.
function partagerAvecJonction(mdp, n) {
  try {
    localStorage.setItem('code', mdp);
    if (n === 'admin') localStorage.setItem('admin', mdp); else localStorage.removeItem('admin');
  } catch (e) {}
}
function oublierJonction() {
  try { localStorage.removeItem('code'); localStorage.removeItem('admin'); } catch (e) {}
}

async function connecter(ev) {
  ev.preventDefault();
  const champ = document.getElementById('mdp');
  const msg = document.getElementById('message');
  const btn = document.getElementById('btnConnexion');
  if (!champ.value) { msg.textContent = 'Saisis le mot de passe.'; return; }
  if (!URL_AUTH || URL_AUTH.indexOf('COLLE_ICI') === 0) {
    msg.textContent = 'Adresse du script de connexion non renseignée (URL_AUTH dans config.js).';
    return;
  }
  btn.disabled = true;
  msg.style.color = '#555';
  msg.textContent = 'Vérification...';
  try {
    const n = lireNiveau(await verifierMotDePasse(champ.value));
    if (n) {
      niveau = n;
      ecrireSession(n);
      partagerAvecJonction(champ.value, n);
      champ.value = '';
      msg.textContent = '';
      dessiner();
    } else {
      msg.style.color = '#b42318';
      msg.textContent = 'Mot de passe incorrect.';
    }
  } catch (e) {
    msg.style.color = '#b42318';
    msg.textContent = 'Connexion impossible : ' + e.message;
  }
  btn.disabled = false;
}

function deconnecter() {
  niveau = null;
  effacerSession();
  oublierJonction();
  dessiner();
}

/* ---------- Affichage ---------- */
function dessiner() {
  const badge = document.getElementById('badge');
  badge.className = 'badge' + (niveau ? ' ' + niveau : '');
  badge.textContent = niveau ? 'Niveau : ' + LIBELLES[niveau] : 'Non connecté';
  document.getElementById('connexion').style.display = niveau ? 'none' : 'block';
  document.getElementById('consigne').style.display = niveau ? 'none' : 'block';
  document.getElementById('deconnexion').style.display = niveau ? 'block' : 'none';

  const zone = document.getElementById('modules');
  zone.innerHTML = '';
  MODULES.forEach(m => {
    const autorise = !!niveau && RANG[niveau] >= RANG[m.niveauMin || 'user'];
    const b = document.createElement('button');
    b.className = 'module';
    b.disabled = !autorise;
    b.appendChild(document.createTextNode((autorise ? '' : '🔒 ') + m.titre));
    const petit = document.createElement('small');
    petit.textContent = m.description;
    b.appendChild(petit);
    b.onclick = () => ouvrir(m);
    zone.appendChild(b);
  });
}

async function ouvrir(m) {
  let url = m.fichier;
  if (m.secours) {
    try {
      const r = await fetch(m.fichier, { method: 'HEAD', cache: 'no-store' });
      if (!r.ok) url = m.secours;   // fichier pas encore déposé ici : on ouvre l'adresse d'origine
    } catch (e) { /* hors ligne : on tente la copie gardée en mémoire */ }
  }
  location.href = url;
}

/* ---------- Démarrage ---------- */
niveau = lireSession();
dessiner();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
