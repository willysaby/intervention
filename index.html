<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e9062">
<title>Accueil</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shell.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); }
  .page { max-width: 560px; margin: 0 auto; padding: 4px 16px 16px; }
  .sous { margin: 0 0 12px; color: var(--mute); font-size: 17px; }
  .badge { display: inline-block; padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; background: var(--pastille); color: var(--mute); margin-bottom: 14px; }
  .badge.technicien { background: var(--tbg); color: var(--tink); }
  .badge.gestionnaire { background: var(--gbg); color: var(--gink); }
  .badge.admin { background: var(--abg); color: var(--aink); }
  .grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; min-height: 118px; }
  .kpi b { display: block; font-size: 42px; line-height: 1.1; }
  .kpi span { display: block; margin-top: 6px; color: var(--mute); font-size: 16px; }
  .kpi.cliquable { cursor: pointer; }
  .kpi .sub { font-size: 13px; margin-top: 2px; }
  .kpi.alerte { background: var(--warnbg); border-color: #e0b100; cursor: pointer; }
  .kpi.alerte b, .kpi.alerte span { color: var(--warnink); }
  .kpi.alerte span.aide { font-weight: 700; font-size: 14px; margin-top: 4px; }
  a.action { order: 10; display: block; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px 14px; color: var(--ink); text-decoration: none; min-height: 150px; }
  a.action.vedette { border: 2px solid var(--lien); }
  a.action .puce { width: 52px; height: 52px; border-radius: 16px; background: var(--accentbg); color: var(--lien); display: grid; place-items: center; margin-bottom: 14px; }
  a.action b { display: block; font-size: 16px; overflow-wrap: break-word; }
  a.action span.d { display: block; margin-top: 4px; color: var(--mute); font-size: 15px; }
  a.gros { display: flex; align-items: center; gap: 16px; width: 100%; background: var(--vert); color: #fff; border-radius: 22px; padding: 20px; text-decoration: none; box-shadow: 0 6px 18px rgba(14,144,98,.25); margin-bottom: 12px; }
  a.gros .pic { flex: none; width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,.18); display: grid; place-items: center; }
  a.gros .tx { min-width: 0; } a.gros .tx b { display: block; font-size: 22px; } a.gros .tx span { display: block; font-size: 14px; opacity: .9; margin-top: 3px; }
  a.gros.attente { background: var(--warnbg); color: var(--warnink); border: 2px solid #e0b100; box-shadow: none; }
  a.gros.attente .pic { background: rgba(0,0,0,.08); }
  a.gros.attente .pastille { background: var(--warnink); color: var(--warnbg); }
  .panneauAtt { background: var(--warnbg); color: var(--warnink); border: 1px solid #e0b100; border-radius: 18px; padding: 14px 16px; margin: -4px 0 12px; display: grid; gap: 10px; }
  .panneauAtt .msg { font-weight: 600; font-size: 15px; }
  .panneauAtt .lienSuite { color: var(--warnink); font-weight: 700; text-align: center; text-decoration: none; padding: 6px; }
  #bandeaux { display: grid; gap: 10px; margin: 12px 0 0; }
  #bandeaux:empty { display: none; }
  #bandeaux a { display: block; border-radius: 16px; padding: 14px 16px; text-decoration: none; font-weight: 700; font-size: 15px; line-height: 1.35; }
  #bandeaux a small { display: block; font-weight: 500; opacity: .9; margin-top: 2px; }
  #bandeaux a.rouge { background: var(--kobg); color: var(--koink); border: 2px solid var(--koink); }
  #bandeaux a.orange { background: var(--warnbg); color: var(--warnink); border: 2px solid #e0b100; }
  a.gros .fl { margin-left: auto; opacity: .85; display: flex; }
  a.gros .pastille { margin-left: auto; background: #fff; color: var(--vert); border-radius: 999px; font-weight: 800; font-size: 15px; padding: 4px 12px; }
  #modules_inter, #indicateurs { grid-template-columns: 1fr; }
  #indicateurs:empty { display: none; }
  #modules_inter a.action { display: grid; grid-template-columns: auto 1fr; column-gap: 16px; align-items: center; min-height: 0; padding: 16px 18px; }
  #modules_inter a.action .puce { margin: 0; grid-row: 1 / span 2; }
  #modules_inter a.action span.d { margin-top: 2px; }
  #modules_inter a.action b { font-size: 18px; }
  a.action.ferme { opacity: .5; pointer-events: none; }
  .carte { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input { color: var(--ink); width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  button.principal { width: 100%; margin-top: 10px; padding: 14px; font-size: 17px; font-weight: 700; color: #fff; background: var(--vert); border: none; border-radius: 14px; }
  button.secondaire { width: 100%; padding: 12px; font-size: 15px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); }
  button:disabled { opacity: .55; }
  #message { margin-top: 8px; font-weight: 600; font-size: 14px; color: var(--koink); min-height: 1em; }
  @media (min-width: 900px) { .page { max-width: 1040px; } .grille { grid-template-columns: repeat(4, minmax(0, 1fr)); } #connexion { max-width: 420px; } }
  .flash { border-radius: 14px; padding: 14px 16px; margin: 0 0 14px; font-weight: 700; font-size: 16px; }
  .flash.ok { background: var(--okbg); color: var(--okink); }
  .flash.attente { background: var(--warnbg); color: var(--warnink); }
  .section { margin: 22px 0 6px; }
  .section h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
  .section h2::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .kpi.achat b small { font-size: 16px; font-weight: 600; color: var(--mute); }
  #consigne { color: var(--mute); font-size: 15px; margin: 0 0 12px; }
</style>
</head>
<body>
<div class="page">
  <p class="sous" id="sousSalut" style="margin-top:16px">Voici l'état des interventions Novafit.</p>
  <div class="flash" id="flash" role="status" hidden></div>
  <span class="badge" id="badge">Non connecté</span>
  <div id="bandeaux"></div>

  <p id="consigne">Saisis le mot de passe pour activer les applications.</p>

  <form class="carte" id="connexion" onsubmit="connecter(event)">
    <label for="mdp">Mot de passe</label>
    <input type="password" id="mdp" autocomplete="current-password">
    <button type="submit" class="principal" id="btnConnexion">Se connecter</button>
    <div id="message"></div>
  </form>

  <div id="contenu" hidden>
    <section class="section" id="secJonc" hidden>
      <h2>Jonction</h2>
      <a class="gros" href="jonction.html"><div class="pic" id="icJonc"></div><div class="tx"><b>Fiche de jonction</b><span>Réglage et contrôle des jonctions</span></div><span class="fl" id="flJonc"></span></a>
    </section>
    <section class="section" id="secInter">
      <h2>Intervention</h2>
      <a class="gros" id="btnInter" href="commandes.html"><div class="pic" id="icInter"></div><div class="tx"><b>Bon d'intervention</b><span id="txtInter">Vierge ou depuis une commande</span></div><span class="pastille" id="pastilleCmd" hidden></span></a>
      <div id="panneauAtt" class="panneauAtt" hidden></div>
      <div class="grille" id="indicateurs"></div>
      <div class="grille" id="modules_inter"></div>
    </section>
    <section class="section" id="secNc" hidden>
      <h2>Non-conformités</h2>
      <div class="grille" id="gridNc"></div>
    </section>
    <section class="section" id="secAch" hidden>
      <h2>Achats</h2>
      <div class="grille" id="gridAch"></div>
    </section>
    <section class="section" id="secFour" hidden>
      <h2>Fournisseurs</h2>
      <div class="grille" id="gridFour"></div>
    </section>
    <section class="section" id="secAdmin" hidden>
      <h2>Administration</h2>
      <div class="grille" id="gridAdmin"></div>
    </section>
  </div>

  <button class="secondaire" id="deconnexion" onclick="deconnecter()" hidden>Se déconnecter</button>
</div>

<script src="config.js"></script>
<script src="commun.js"></script>
<script src="shell.js"></script>
<script>
const CFG = window.CONFIG || {};
const URL_API = CFG.URL_API || '';
const CLE_SESSION = 'sessionAccueil';
const DUREE_SESSION_H = 12;
const LIBELLES = { technicien: 'Technicien', gestionnaire: 'Gestionnaire', admin: 'Administrateur' };
const RANG = { technicien: 1, gestionnaire: 2, admin: 3 };

// Boutons de l'accueil. Pour en ajouter un : copier une ligne.
// droit : jonction, intervention, nc, achats, gestion, fournisseurs ou admin (réglés pour chaque personne dans la page Utilisateurs)
const MODULES = [
  { titre: 'Interventions finies', description: 'Bons réalisés et PDF des commandes', fichier: 'termines.html', droit: 'gestion', icone: 'check', groupe: 'inter' },
  { titre: 'Ajouter une NC', description: 'Non-conformité : commande, fournisseur, fabrication', fichier: 'nc-ajout.html', droit: 'nc', icone: 'alert', groupe: 'nc' },
  { titre: 'Nouvelle commande', description: 'Commande fournisseur : PDF et mail', fichier: 'achat-nouveau.html', droit: 'achats', icone: 'cart', groupe: 'achats' },
  { titre: 'Chercher un fournisseur', description: 'Matières et produits finis, par mot-clé', fichier: 'fournisseurs.html', droit: 'fournisseurs', icone: 'tag', groupe: 'four' }
];

let niveau = null;

/* ---------- Session (garde le niveau et le jeton quelques heures sur l'appareil) ---------- */
function lireSession() {
  try {
    const s = JSON.parse(localStorage.getItem(CLE_SESSION));
    if (s && RANG[s.niveau] && Array.isArray(s.droits) && s.jeton && s.expire > Date.now()) return s;
  } catch (e) {}
  return null;
}
function ecrireSession(res) {
  try {
    localStorage.setItem(CLE_SESSION, JSON.stringify({ niveau: res.niveau, nom: res.nom || '', droits: res.droits, jeton: res.jeton, expire: Date.now() + DUREE_SESSION_H * 3600 * 1000 }));
  } catch (e) {}
}
function effacerSession() {
  try { localStorage.removeItem(CLE_SESSION); } catch (e) {}
}

/* ---------- Vérification du mot de passe ---------- */
// Le script Apps Script des bons vérifie le code auprès du script Jonction (qui contient
// les trois codes) et répond { ok, niveau, jeton }.
async function verifierMotDePasse(mdp) {
  let r;
  try {
    r = await fetch(URL_API, { method: 'POST', body: JSON.stringify({ action: 'login', code: mdp, appareil: Nova.appareil() }) });
  } catch (e) {
    throw new Error('serveur injoignable (réseau ou accès au script).');
  }
  try {
    return await r.json();
  } catch (e) {
    throw new Error('réponse inattendue du script (nouvelle version à déployer dans Apps Script ?).');
  }
}

function lireNiveau(res) {
  if (!res || !res.ok || !res.jeton || !RANG[res.niveau] || !Array.isArray(res.droits)) return null;
  return res.niveau;
}

// Jonction garde le code dans le téléphone (clés "code" et "admin") : on les renseigne aussi
// pour qu'il s'ouvre déjà connecté.
function partagerAvecJonction(j) {
  try {
    j = j || {};
    if (j.code) localStorage.setItem('code', j.code); else localStorage.removeItem('code');
    if (j.admin) localStorage.setItem('admin', j.admin); else localStorage.removeItem('admin');
  } catch (e) {}
}
function oublierJonction() {
  try {
    ['code', 'admin', 'cache', 'commandesCache', 'termineCache', 'ncCache', 'ncSchemaCache', 'achatsCache', 'achatInitCache', 'achatsCompte_' + new Date().getFullYear()].forEach(k => localStorage.removeItem(k));
  } catch (e) {}
}

async function connecter(ev) {
  ev.preventDefault();
  const champ = document.getElementById('mdp');
  const msg = document.getElementById('message');
  const btn = document.getElementById('btnConnexion');
  if (!champ.value) { msg.textContent = 'Saisis le mot de passe.'; return; }
  if (!URL_API || URL_API.indexOf('COLLE_ICI') === 0) {
    msg.textContent = 'Adresse du script non renseignée (URL_API dans config.js).';
    return;
  }
  btn.disabled = true;
  msg.style.color = 'var(--mute)';
  msg.textContent = 'Vérification...';
  try {
    const res = await verifierMotDePasse(champ.value);
    const n = lireNiveau(res);
    if (n) {
      niveau = n;
      ecrireSession(res);
      partagerAvecJonction(res.jonction);
      champ.value = '';
      msg.textContent = '';
      location.reload();   // la barre d'onglets du bas se reconstruit avec le nouveau niveau
      return;
    } else {
      msg.style.color = 'var(--koink)';
      msg.textContent = (res && res.erreur) ? res.erreur : 'Mot de passe incorrect.';
    }
  } catch (e) {
    msg.style.color = 'var(--koink)';
    msg.textContent = 'Connexion impossible : ' + e.message;
  }
  btn.disabled = false;
}

function deconnecter() {
  niveau = null;
  effacerSession();
  oublierJonction();
  location.reload();
}

/* ---------- Affichage ---------- */
function peut(d) { return !!niveau && Nova.peut(d); }

function dessiner() {
  const badge = document.getElementById('badge');
  badge.className = 'badge' + (niveau ? ' ' + niveau : '');
  const s = lireSession();
  badge.textContent = niveau ? (s && s.nom ? 'Connecté : ' + s.nom : 'Niveau : ' + LIBELLES[niveau]) : 'Non connecté';
  document.getElementById('connexion').hidden = !!niveau;
  document.getElementById('consigne').hidden = !!niveau;
  document.getElementById('deconnexion').hidden = !niveau;
  document.getElementById('contenu').hidden = !niveau;
  const modulesVisibles = MODULES.filter(m => peut(m.droit));
  const aGroupe = g => modulesVisibles.some(m => m.groupe === g);
  document.getElementById('secJonc').hidden = !peut('jonction');
  document.getElementById('secInter').hidden = !(peut('intervention') || aGroupe('inter'));
  document.getElementById('btnInter').hidden = !peut('intervention');
  document.getElementById('icJonc').innerHTML = Shell.svg('sliders', 30);
  document.getElementById('flJonc').innerHTML = Shell.svg('chevron', 24);
  document.getElementById('icInter').innerHTML = Shell.svg('wrench', 30);
  document.getElementById('indicateurs').hidden = !peut('intervention');
  document.getElementById('secNc').hidden = !peut('nc');
  document.getElementById('secAch').hidden = !peut('achats');
  document.getElementById('secFour').hidden = !peut('fournisseurs');
  document.getElementById('secAdmin').hidden = !peut('admin');
  document.getElementById('modules_inter').innerHTML = '';
  document.querySelectorAll('#gridNc a.action, #gridAch a.action, #gridFour a.action').forEach(a => a.remove());
  modulesVisibles.forEach(m => {
    const a = document.createElement('a');
    a.className = 'action' + (m.vedette ? ' vedette' : '');
    a.href = m.fichier;
    a.innerHTML = '<div class="puce">' + Shell.svg(m.icone, 26) + '</div><b></b><span class="d"></span>';
    a.querySelector('b').textContent = m.titre;
    a.querySelector('.d').textContent = m.description;
    document.getElementById({ nc: 'gridNc', achats: 'gridAch', four: 'gridFour' }[m.groupe] || 'modules_inter').appendChild(a);
  });
  if (niveau) chargerIndicateurs(); else { retirerCartesNc(); retirerCarteAchats(); retirerCarteUsers(); }
}

/* ---------- Indicateurs ---------- */
function carte(id) {
  let c = document.getElementById(id);
  if (!c) {
    c = document.createElement('div');
    c.id = id;
    c.className = 'kpi';
    c.innerHTML = '<b>…</b><span class="lib"></span><span class="aide" hidden></span>';
    document.getElementById('indicateurs').appendChild(c);
  }
  return c;
}
function lireAttente() {
  try { return JSON.parse(localStorage.getItem('bonsEnAttente')) || []; } catch (e) { return []; }
}
let envoiEnCours = false, messageAtt = '', panneauOuvert = false;
function nbAttente() { return lireAttente().length + Nova.lireFile().length; }
function majAttente(message) {
  if (message !== undefined) messageAtt = message;
  const n = nbAttente();
  const btn = document.getElementById('btnInter');
  const pan = document.getElementById('panneauAtt');
  btn.classList.toggle('attente', n > 0);
  document.getElementById('pastilleCmd').style.display = n > 0 ? 'none' : '';
  document.getElementById('txtInter').textContent = n > 0
    ? n + (n > 1 ? ' envois en attente' : ' envoi en attente') + ' · touche pour envoyer'
    : 'Vierge ou depuis une commande';
  if (!panneauOuvert && !messageAtt) { pan.hidden = true; return; }
  const err = Nova.lireFile().find(x => x.erreur);
  pan.hidden = false;
  pan.innerHTML = '';
  const t = document.createElement('div');
  t.className = 'msg';
  t.textContent = messageAtt || (err ? 'Refusé : ' + err.erreur : n + (n > 1 ? ' envois sont gardés sur l\'appareil (bons, NC, achats, fournisseurs).' : ' envoi est gardé sur l\'appareil (bon, NC, achat ou fournisseur).'));
  pan.appendChild(t);
  if (n > 0 && !envoiEnCours) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'principal'; b.textContent = 'Envoyer maintenant';
    b.onclick = envoyerTout;
    pan.appendChild(b);
  }
  const l = document.createElement('a');
  l.href = 'commandes.html'; l.className = 'lienSuite'; l.textContent = 'Continuer vers les bons →';
  pan.appendChild(l);
}
document.getElementById('btnInter').addEventListener('click', e => {
  if (nbAttente() > 0 && !panneauOuvert) { e.preventDefault(); panneauOuvert = true; majAttente(); }
});
document.addEventListener('nova:file', () => majAttente());
async function envoyerTout() {
  if (envoiEnCours) return;
  if (!navigator.onLine) { majAttente('Hors ligne : les envois restent sur l\'appareil.'); return; }
  envoiEnCours = true;
  majAttente('Envoi en cours...');
  let envoyes = 0, erreur = '', avert = '';
  for (const bon of lireAttente()) {
    try {
      const res = await Nova.api('bon', bon.donnees, 30000);
      if (res.avertissement) avert = res.avertissement;
      localStorage.setItem('bonsEnAttente', JSON.stringify(lireAttente().filter(b => b.id !== bon.id)));
      envoyes++;
    } catch (e) {
      erreur = e.message;
      break;
    }
  }
  if (!erreur && Nova.lireFile().length) {
    const avant = Nova.lireFile().length;
    try { await Nova.viderFile(); } catch (e) {}
    envoyes += Math.max(0, avant - Nova.lireFile().length);
  }
  envoiEnCours = false;
  const reste = nbAttente();
  if (erreur) majAttente('Échec : ' + erreur);
  else if (reste) majAttente(envoyes + ' envoyé' + (envoyes > 1 ? 's' : '') + ', ' + reste + ' refusé' + (reste > 1 ? 's' : '') + (Nova.lireFile().find(x => x.erreur) ? ' : ' + Nova.lireFile().find(x => x.erreur).erreur : ''));
  else majAttente(envoyes + (envoyes > 1 ? ' envois effectués' : ' envoi effectué') + (avert ? ' ⚠ ' + avert : ''));
  if (envoyes) chargerCommandes();
}
function majPastille(n) { const p = document.getElementById('pastilleCmd'); p.textContent = n; p.hidden = false; }
async function chargerCommandes() {
  let memo = null;
  try { memo = JSON.parse(localStorage.getItem('commandesCache')); } catch (e) {}
  if (Array.isArray(memo)) majPastille(memo.length);   // affichage immédiat, mis à jour ensuite
  try {
    const r = await Nova.api('commandes', null, 10000);
    majPastille(r.commandes.length);
  } catch (e) {}
}

/* ---------- Non-conformités (gestionnaire et administrateur) ---------- */
const NC_CARTES = [
  { type: 'fournisseur', lib: 'NC fournisseur' },
  { type: 'fabrication', lib: 'NC fabrication' },
  { type: 'commande', lib: 'NC commande' }
];
function retirerCartesNc() {
  document.querySelectorAll('#gridNc .kNc').forEach(c => c.remove());
}
function carteNc(type, lib, periode) {
  const id = 'kNc_' + type + '_' + periode;
  let c = document.getElementById(id);
  if (!c) {
    c = document.createElement('div');
    c.id = id;
    c.className = 'kpi kNc cliquable';
    c.setAttribute('role', 'link');
    c.tabIndex = 0;
    c.innerHTML = '<b>…</b><span class="lib"></span><span class="sub"></span>';
    c.querySelector('.lib').textContent = lib;
    c.querySelector('.sub').textContent = periode === '30' ? '30 derniers jours' : 'Total';
    const aller = () => { location.href = 'nc.html?type=' + type + (periode === '30' ? '&periode=30' : ''); };
    c.onclick = aller;
    c.onkeydown = e => { if (e.key === 'Enter') aller(); };
    document.getElementById('gridNc').appendChild(c);
  }
  return c;
}
async function chargerNc() {
  if (!peut('nc')) { retirerCartesNc(); return; }
  const cartes = {};
  NC_CARTES.forEach(x => { cartes[x.type] = { total: carteNc(x.type, x.lib, 'tout'), jours: carteNc(x.type, x.lib, '30') }; });
  try {
    const r = await Nova.api('ncStats', null, 10000);
    NC_CARTES.forEach(x => {
      cartes[x.type].total.querySelector('b').textContent = r.stats[x.type].total;
      cartes[x.type].jours.querySelector('b').textContent = r.stats[x.type].jours;
    });
  } catch (e) {
    NC_CARTES.forEach(x => { cartes[x.type].total.querySelector('b').textContent = '–'; cartes[x.type].jours.querySelector('b').textContent = '–'; });
  }
}
/* ---------- Achats (gestionnaire et administrateur) ---------- */
function retirerCarteAchats() {
  const c = document.getElementById('kAch'); if (c) c.remove();
}
async function chargerAchats() {
  if (!peut('achats')) { retirerCarteAchats(); return; }
  let c = document.getElementById('kAch');
  if (!c) {
    c = document.createElement('div');
    c.id = 'kAch';
    c.className = 'kpi achat cliquable';
    c.setAttribute('role', 'link');
    c.tabIndex = 0;
    c.innerHTML = '<b>…</b><span class="lib"></span><span class="sub">Appuie pour voir la liste</span>';
    const aller = () => { location.href = 'achats.html'; };
    c.onclick = aller;
    c.onkeydown = e => { if (e.key === 'Enter') aller(); };
    document.getElementById('gridAch').appendChild(c);
  }
  const an = new Date().getFullYear();
  c.querySelector('.lib').textContent = 'Commandes en ' + an;
  let memo = null;
  try { memo = localStorage.getItem('achatsCompte_' + an); } catch (e) {}
  if (memo !== null) c.querySelector('b').textContent = memo;
  try {
    const r = await Nova.api('achatListe', null, 10000);
    const n = r.lignes.filter(l => String(l.date).slice(0, 4) === String(an)).length;
    c.querySelector('b').textContent = n;
    try { localStorage.setItem('achatsCompte_' + an, String(n)); } catch (e) {}
  } catch (e) { if (memo === null) c.querySelector('b').textContent = '–'; }
}
/* ---------- Utilisateurs (administrateur) : voyant orange en cas de nouvel appareil ---------- */
function retirerCarteUsers() {
  const c = document.getElementById('kUsers'); if (c) c.remove();
  document.getElementById('bandeaux').innerHTML = '';
}
/* Bandeaux de l'administrateur : rien quand tout va bien ; rouge si l'arrêt d'urgence est actif ; orange si quelqu'un dépasse le seuil d'envois du jour */
function majBandeaux(r) {
  const z = document.getElementById('bandeaux');
  z.innerHTML = '';
  const ajouter = (cls, titre, detail) => {
    const a = document.createElement('a');
    a.href = 'utilisateurs.html'; a.className = cls;
    a.textContent = titre;
    if (detail) { const sm = document.createElement('small'); sm.textContent = detail; a.appendChild(sm); }
    z.appendChild(a);
  };
  if (r.bloque) ajouter('rouge', '⛔ Envois bloqués (arrêt d\'urgence)', 'Activé par ' + (r.bloquePar || '?') + (r.bloqueLe ? ' le ' + r.bloqueLe : '') + ' · touche pour réactiver');
  (r.alertes || []).forEach(x => ajouter('orange', '⚠ ' + x.nom + ' : ' + x.envois + ' envois aujourd\'hui', 'Plus de ' + r.seuil + ' envois dans la journée · touche pour gérer les utilisateurs'));
}
async function chargerUsers() {
  if (!peut('admin')) { retirerCarteUsers(); return; }
  let c = document.getElementById('kUsers');
  if (!c) {
    c = document.createElement('div');
    c.id = 'kUsers';
    c.className = 'kpi cliquable';
    c.setAttribute('role', 'link');
    c.tabIndex = 0;
    c.innerHTML = '<b>…</b><span class="lib">Utilisateurs actifs</span><span class="aide" hidden></span>';
    const aller = () => { location.href = 'utilisateurs.html'; };
    c.onclick = aller;
    c.onkeydown = e => { if (e.key === 'Enter') aller(); };
    document.getElementById('gridAdmin').appendChild(c);
  }
  try {
    const r = await Nova.api('usersResume', null, 10000);
    majBandeaux(r);
    c.querySelector('b').textContent = r.actifs;
    const aide = c.querySelector('.aide');
    c.classList.toggle('alerte', r.nouveaux.length > 0);
    aide.hidden = false;
    aide.textContent = r.nouveaux.length
      ? 'Nouvel appareil : ' + [...new Set(r.nouveaux.map(a => a.nom))].join(', ')
      : 'Droits, codes et appareils';
  } catch (e) { c.querySelector('b').textContent = '–'; }
}
function chargerIndicateurs() {
  chargerAchats();
  if (peut('intervention')) { chargerCommandes(); majAttente(); }
  chargerNc();
  chargerUsers();
}


/* ---------- Message laissé par la page du bon (« Envoi validé » / « Bon enregistré ») ---------- */
function afficherFlash() {
  let f = null;
  try { f = JSON.parse(localStorage.getItem('flashAccueil')); localStorage.removeItem('flashAccueil'); } catch (e) {}
  if (!f || !f.texte || Date.now() - (f.ts || 0) > 120000) return;
  const el = document.getElementById('flash');
  el.className = 'flash ' + (f.type === 'ok' ? 'ok' : 'attente');
  el.textContent = (f.type === 'ok' ? '✓ ' : '⏳ ') + f.texte;
  el.hidden = false;
}

/* ---------- Démarrage ---------- */
const sessionEnCours = lireSession();
niveau = sessionEnCours ? sessionEnCours.niveau : null;
afficherFlash();
dessiner();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
