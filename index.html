<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e9062">
<title>Accueil</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shell.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); }
  .page { max-width: 560px; margin: 0 auto; padding: 4px 16px 16px; }
  .sous { margin: 0 0 12px; color: var(--mute); font-size: 17px; }
  .badge { display: inline-block; padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; background: var(--pastille); color: var(--mute); margin-bottom: 14px; }
  .badge.technicien { background: var(--tbg); color: var(--tink); }
  .badge.gestionnaire { background: var(--gbg); color: var(--gink); }
  .badge.admin { background: var(--abg); color: var(--aink); }
  .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; min-height: 118px; }
  .kpi b { display: block; font-size: 42px; line-height: 1.1; }
  .kpi span { display: block; margin-top: 6px; color: var(--mute); font-size: 16px; }
  .kpi.alerte { background: var(--warnbg); border-color: #e0b100; cursor: pointer; }
  .kpi.alerte b, .kpi.alerte span { color: var(--warnink); }
  .kpi.alerte span.aide { font-weight: 700; font-size: 14px; margin-top: 4px; }
  a.action { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; color: var(--ink); text-decoration: none; min-height: 150px; }
  a.action.vedette { border: 2px solid var(--lien); }
  a.action .puce { width: 52px; height: 52px; border-radius: 16px; background: var(--accentbg); color: var(--lien); display: grid; place-items: center; margin-bottom: 14px; }
  a.action b { display: block; font-size: 20px; }
  a.action span.d { display: block; margin-top: 4px; color: var(--mute); font-size: 15px; }
  a.action.ferme { opacity: .5; pointer-events: none; }
  .carte { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input { color: var(--ink); width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  button.principal { width: 100%; margin-top: 10px; padding: 14px; font-size: 17px; font-weight: 700; color: #fff; background: var(--vert); border: none; border-radius: 14px; }
  button.secondaire { width: 100%; padding: 12px; font-size: 15px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); }
  button:disabled { opacity: .55; }
  #message { margin-top: 8px; font-weight: 600; font-size: 14px; color: var(--koink); min-height: 1em; }
  #consigne { color: var(--mute); font-size: 15px; margin: 0 0 12px; }
</style>
</head>
<body>
<div class="page">
  <p class="sous" id="sousSalut" style="margin-top:16px">Voici l'état des interventions Novafit.</p>
  <span class="badge" id="badge">Non connecté</span>

  <p id="consigne">Saisis le mot de passe pour activer les applications.</p>

  <form class="carte" id="connexion" onsubmit="connecter(event)">
    <label for="mdp">Mot de passe</label>
    <input type="password" id="mdp" autocomplete="current-password">
    <button type="submit" class="principal" id="btnConnexion">Se connecter</button>
    <div id="message"></div>
  </form>

  <div class="grille" id="indicateurs" hidden></div>
  <div class="grille" id="modules"></div>

  <button class="secondaire" id="deconnexion" onclick="deconnecter()" hidden>Se déconnecter</button>
</div>

<script src="config.js"></script>
<script src="commun.js"></script>
<script src="shell.js"></script>
<script>
const CFG = window.CONFIG || {};
const URL_API = CFG.URL_API || '';
const CLE_SESSION = 'sessionAccueil';
const DUREE_SESSION_H = 12;
const LIBELLES = { technicien: 'Technicien', gestionnaire: 'Gestionnaire', admin: 'Administrateur' };
const RANG = { technicien: 1, gestionnaire: 2, admin: 3 };

// Boutons de l'accueil. Pour en ajouter un : copier une ligne.
// niveauMin : 'technicien' (tout le monde), 'gestionnaire' ou 'admin' (ce niveau et ceux au-dessus)
const MODULES = [
  { titre: 'Bon d\'intervention vierge', description: 'Saisie d\'un bon sans commande', fichier: 'intervention.html', niveauMin: 'technicien', icone: 'plus' },
  { titre: 'Bon d\'intervention de commande', description: 'Choisir une commande en cours', fichier: 'commandes.html', niveauMin: 'technicien', icone: 'list', vedette: true },
  { titre: 'Interventions finies', description: 'Bons réalisés et PDF des commandes', fichier: 'termines.html', niveauMin: 'gestionnaire', icone: 'check' },
  { titre: 'Jonction', description: 'Paramètres de jonction', fichier: 'jonction.html', niveauMin: 'technicien', icone: 'sliders' }
];

let niveau = null;

/* ---------- Session (garde le niveau et le jeton quelques heures sur l'appareil) ---------- */
function lireSession() {
  try {
    const s = JSON.parse(localStorage.getItem(CLE_SESSION));
    if (s && RANG[s.niveau] && s.jeton && s.expire > Date.now()) return s;
  } catch (e) {}
  return null;
}
function ecrireSession(n, jeton) {
  try {
    localStorage.setItem(CLE_SESSION, JSON.stringify({ niveau: n, jeton: jeton, expire: Date.now() + DUREE_SESSION_H * 3600 * 1000 }));
  } catch (e) {}
}
function effacerSession() {
  try { localStorage.removeItem(CLE_SESSION); } catch (e) {}
}

/* ---------- Vérification du mot de passe ---------- */
// Le script Apps Script des bons vérifie le code auprès du script Jonction (qui contient
// les trois codes) et répond { ok, niveau, jeton }.
async function verifierMotDePasse(mdp) {
  let r;
  try {
    r = await fetch(URL_API, { method: 'POST', body: JSON.stringify({ action: 'login', code: mdp }) });
  } catch (e) {
    throw new Error('serveur injoignable (réseau ou accès au script).');
  }
  try {
    return await r.json();
  } catch (e) {
    throw new Error('réponse inattendue du script (nouvelle version à déployer dans Apps Script ?).');
  }
}

function lireNiveau(res) {
  if (!res || !res.ok || !res.jeton || !RANG[res.niveau]) return null;
  return res.niveau;
}

// Jonction garde le code dans le téléphone (clés "code" et "admin") : on les renseigne aussi
// pour qu'il s'ouvre déjà connecté.
function partagerAvecJonction(mdp, n) {
  try {
    localStorage.setItem('code', mdp);
    if (n === 'admin') localStorage.setItem('admin', mdp); else localStorage.removeItem('admin');
  } catch (e) {}
}
function oublierJonction() {
  try {
    ['code', 'admin', 'cache', 'commandesCache', 'termineCache'].forEach(k => localStorage.removeItem(k));
  } catch (e) {}
}

async function connecter(ev) {
  ev.preventDefault();
  const champ = document.getElementById('mdp');
  const msg = document.getElementById('message');
  const btn = document.getElementById('btnConnexion');
  if (!champ.value) { msg.textContent = 'Saisis le mot de passe.'; return; }
  if (!URL_API || URL_API.indexOf('COLLE_ICI') === 0) {
    msg.textContent = 'Adresse du script non renseignée (URL_API dans config.js).';
    return;
  }
  btn.disabled = true;
  msg.style.color = 'var(--mute)';
  msg.textContent = 'Vérification...';
  try {
    const res = await verifierMotDePasse(champ.value);
    const n = lireNiveau(res);
    if (n) {
      niveau = n;
      ecrireSession(n, res.jeton);
      partagerAvecJonction(champ.value, n);
      champ.value = '';
      msg.textContent = '';
      dessiner();
    } else {
      msg.style.color = 'var(--koink)';
      msg.textContent = (res && res.erreur) ? res.erreur : 'Mot de passe incorrect.';
    }
  } catch (e) {
    msg.style.color = 'var(--koink)';
    msg.textContent = 'Connexion impossible : ' + e.message;
  }
  btn.disabled = false;
}

function deconnecter() {
  niveau = null;
  effacerSession();
  oublierJonction();
  dessiner();
}

/* ---------- Affichage ---------- */
function dessiner() {
  const badge = document.getElementById('badge');
  badge.className = 'badge' + (niveau ? ' ' + niveau : '');
  badge.textContent = niveau ? 'Niveau : ' + LIBELLES[niveau] : 'Non connecté';
  document.getElementById('connexion').hidden = !!niveau;
  document.getElementById('consigne').hidden = !!niveau;
  document.getElementById('deconnexion').hidden = !niveau;
  document.getElementById('indicateurs').hidden = !niveau;
  const zone = document.getElementById('modules');
  zone.innerHTML = '';
  MODULES.forEach(m => {
    const autorise = !!niveau && RANG[niveau] >= RANG[m.niveauMin || 'technicien'];
    const a = document.createElement('a');
    a.className = 'action' + (m.vedette && autorise ? ' vedette' : '') + (autorise ? '' : ' ferme');
    a.href = autorise ? m.fichier : '#';
    a.innerHTML = '<div class="puce">' + Shell.svg(autorise ? m.icone : 'lock', 26) + '</div><b></b><span class="d"></span>';
    a.querySelector('b').textContent = m.titre;
    a.querySelector('.d').textContent = m.description;
    zone.appendChild(a);
  });
  if (niveau) chargerIndicateurs();
}

/* ---------- Indicateurs ---------- */
function carte(id) {
  let c = document.getElementById(id);
  if (!c) {
    c = document.createElement('div');
    c.id = id;
    c.className = 'kpi';
    c.innerHTML = '<b>…</b><span class="lib"></span><span class="aide" hidden></span>';
    document.getElementById('indicateurs').appendChild(c);
  }
  return c;
}
function lireAttente() {
  try { return JSON.parse(localStorage.getItem('bonsEnAttente')) || []; } catch (e) { return []; }
}
let renvoiEnCours = false;
function majAttente(message) {
  const n = lireAttente().length;
  const c = carte('kAtt');
  c.querySelector('b').textContent = n;
  c.querySelector('.lib').textContent = n > 1 ? 'Bons en attente d\'envoi' : 'Bon en attente d\'envoi';
  const aide = c.querySelector('.aide');
  c.classList.toggle('alerte', n > 0);
  aide.hidden = !(n > 0 || message);
  aide.textContent = message || (n > 0 ? 'Appuie pour renvoyer' : '');
  c.onclick = n > 0 ? renvoyerBons : null;
}
async function renvoyerBons() {
  if (renvoiEnCours) return;
  if (!navigator.onLine) { majAttente('Hors ligne : les bons restent sur l\'appareil.'); return; }
  renvoiEnCours = true;
  majAttente('Envoi en cours...');
  let envoyes = 0, erreur = '', avert = '';
  for (const bon of lireAttente()) {
    try {
      const res = await Nova.api('bon', bon.donnees);
      if (res.avertissement) avert = res.avertissement;
      localStorage.setItem('bonsEnAttente', JSON.stringify(lireAttente().filter(b => b.id !== bon.id)));
      envoyes++;
    } catch (e) {
      erreur = e.message;
      break;
    }
  }
  renvoiEnCours = false;
  const reste = lireAttente().length;
  if (erreur) {
    majAttente('Échec : ' + erreur);
    if (reste) document.getElementById('kAtt').onclick = renvoyerBons;
  } else {
    majAttente(envoyes + (envoyes > 1 ? ' bons envoyés' : ' bon envoyé') + (avert ? ' ⚠ ' + avert : ''));
  }
  if (envoyes) chargerCommandes();
}
async function chargerCommandes() {
  const c = carte('kCmd');
  c.querySelector('.lib').textContent = 'Interventions à réaliser';
  try {
    const r = await Nova.api('commandes');
    c.querySelector('b').textContent = r.commandes.length;
  } catch (e) { c.querySelector('b').textContent = '–'; }
}
function chargerIndicateurs() {
  chargerCommandes();
  majAttente();
}

/* ---------- Démarrage ---------- */
const sessionEnCours = lireSession();
niveau = sessionEnCours ? sessionEnCours.niveau : null;
dessiner();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
