<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17784a">
<title>Relevé commercial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Outil terrain, une colonne : en-tête sobre, cartes d'éléments, plans cotés façon dessin technique, barre d'action en bas */
:root{
  --bg:#eef3f0; --surface:#ffffff; --sunk:#e2eae5; --ink:#15202b; --muted:#566573; --line:#cdd9d2;
  --accent:#17784a; --accent-ink:#ffffff; --accent-soft:#dcefe3;
  --cote:#c2410c; --cote-soft:#fbe6da; --ok:#1f7a4a; --warn:#a15c00; --danger:#b42318;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1512; --surface:#16211c; --sunk:#101a15; --ink:#e4eaf0; --muted:#93a2b0; --line:#2a3a32;
  --accent:#4cc38a; --accent-ink:#07170f; --accent-soft:#16332a; --cote:#f59a5b; --cote-soft:#3a2418;
  --ok:#4cc38a; --warn:#e5a54b; --danger:#f07167; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1512; --surface:#16211c; --sunk:#101a15; --ink:#e4eaf0; --muted:#93a2b0; --line:#2a3a32;
  --accent:#4cc38a; --accent-ink:#07170f; --accent-soft:#16332a; --cote:#f59a5b; --cote-soft:#3a2418;
  --ok:#4cc38a; --warn:#e5a54b; --danger:#f07167; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:10px;min-height:56px;padding-block:8px}
.top h1{font-family:var(--f-display);font-size:18px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .hsub{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.wrap{padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],textarea,select{
  width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-height:44px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.icon-btn{border:0;background:transparent;color:var(--ink);width:40px;height:40px;border-radius:8px;display:grid;place-items:center}
.icon-btn:hover{background:var(--sunk)}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner p{margin:0;flex:1;min-width:180px}
/* Rendez-vous */
.rdv-head{display:flex;flex-direction:column;gap:2px}
.rdv-head .client{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.15;text-wrap:balance}
.rdv-head .when{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Tuiles */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}.tiles .tile:last-child{grid-column:1/-1;flex-direction:row;justify-content:center;gap:12px}}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-weight:600;font-size:14px}
.tile svg{width:56px;height:34px;color:var(--accent)}
.tile:hover{border-color:var(--accent)}
.ico-tuyau .part,.ico-tuyau .part2{fill:none;stroke:currentColor;stroke-width:6.5;stroke-linejoin:round}
.ico-tuyau .thin{display:none}
.tile .plus{font-size:12px;font-weight:500;color:var(--muted)}
/* Liste éléments */
.items{display:flex;flex-direction:column;gap:10px}
.itemrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.trash{border:1px solid var(--line);background:var(--surface);color:var(--danger);border-radius:var(--r);width:48px;display:grid;place-items:center}
.alert{border:1.5px solid var(--danger);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.alert p{margin:0}.alert .row{justify-content:flex-end}
.cote-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;color:var(--ink)}
.rep{font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--cote-soft);color:var(--cote);border-radius:6px;padding:4px 7px;min-width:42px;text-align:center}
.item .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .s{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:14px}
/* Plan coté */
.plan{position:relative;width:100%;max-width:100%;aspect-ratio:400/250;background:var(--sunk);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.plan svg{position:absolute;inset:0;width:100%;height:100%}
.plan .part{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.plan .part2{fill:var(--sunk);stroke:var(--ink);stroke-width:1.4}
.plan .thin{fill:none;stroke:var(--ink);stroke-width:1;opacity:.55}
.plan .axis{fill:none;stroke:var(--muted);stroke-width:.8;stroke-dasharray:10 3 2 3}
.plan .ext{stroke:var(--cote);stroke-width:.8;opacity:.8}
.plan .dim{stroke:var(--cote);stroke-width:1}
.plan .mk{fill:var(--cote)}
.plan .opt{fill:none;stroke:var(--accent);stroke-width:1.6}
.plan .optf{fill:var(--accent);opacity:.18;stroke:var(--accent);stroke-width:1}
.plan .tag{font:500 9px var(--f-body);fill:var(--muted)}
.bub{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none}
.bub span{font:600 9.5px/1 var(--f-body);color:var(--cote);background:var(--sunk);padding:1px 4px;border-radius:4px;white-space:nowrap}
.bub input,.bub b{pointer-events:auto;width:72px;min-height:0;height:28px;padding:0 6px;text-align:center;font:600 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--cote);border-radius:999px;display:flex;align-items:center;justify-content:center}
.bub b{width:auto;min-width:54px;padding:0 9px;white-space:nowrap}
.bub b.vide{color:var(--muted);font-weight:500}
.bub input.req:placeholder-shown{border-style:dashed;background:var(--cote-soft)}
@media (min-width:560px){.bub input{width:84px;height:32px;font-size:14px}.bub span{font-size:10.5px}}
/* Options */
.opt-block{display:flex;flex-direction:column;gap:8px;padding-block:10px;border-top:1px solid var(--line)}
.opt-block:first-child{border-top:0;padding-top:0}
.opt-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.opt-head .lbl{color:var(--ink);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;min-height:36px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sub{display:flex;flex-direction:column;gap:10px;padding:10px 0 2px 12px;border-left:2px solid var(--accent-soft);margin-left:4px}
.unit{position:relative}
.unit input{padding-right:42px}
.unit em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.qty button{border:0;background:var(--sunk);color:var(--ink);width:44px;height:44px;font-size:20px}
.qty output{min-width:48px;text-align:center;font:600 16px var(--f-mono)}
/* Photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.photo{display:flex;flex-direction:column;gap:6px;min-width:0}
.photo .img{position:relative;border-radius:8px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .pid{position:absolute;left:6px;top:6px;font:600 11px var(--f-mono);background:var(--surface);color:var(--ink);padding:2px 6px;border-radius:5px}
.photo .del{position:absolute;right:4px;top:4px;width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);color:var(--danger);font-size:18px;line-height:1}
.photo textarea{min-height:56px;font-size:14px}
.add-photo{display:flex;gap:10px;flex-wrap:wrap}
.add-photo label{flex:1;min-width:140px;text-align:center;border:1.5px dashed var(--line);border-radius:8px;padding:12px;font-weight:600;color:var(--accent);cursor:pointer}
.add-photo input{position:absolute;width:1px;height:1px;opacity:0}
.err{color:var(--danger);font-size:13px;font-weight:600}
/* Récap */
#recap{display:flex;flex-direction:column;gap:16px}
.rc-item{display:flex;flex-direction:column;gap:12px}
.rc-title{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rc-title h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.rc-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rc-photos figure{margin:0;display:flex;flex-direction:column;gap:4px}
.rc-photos img{border-radius:8px;width:100%;aspect-ratio:4/3;object-fit:cover}
.rc-photos figcaption{font-size:13px}
.rc-photos figcaption b{font-family:var(--f-mono);color:var(--cote)}
.comment{font-size:14px;background:var(--sunk);border-radius:8px;padding:10px 12px;white-space:pre-wrap;margin:0}
/* Barre du bas */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar-in{max-width:640px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px}
.bar-in .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.mailto{font-family:var(--f-mono);font-size:13px;user-select:all;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.tile{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main class="wrap" id="app"></main>
<nav class="bar"><div class="bar-in" id="bar"></div></nav>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
/* ============ Définition des éléments ============ */
const MK = '<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.5L10,5L0,8.5z" class="mk"/></marker></defs>';
const L = (x1,y1,x2,y2,c) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
const D = (x1,y1,x2,y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>`;
/* flèches de diamètre extérieures (petits diamètres) */
const DD = (x,ya,yb) => `<line x1="${x}" y1="${ya-22}" x2="${x}" y2="${ya}" class="dim" marker-end="url(#a)"/><line x1="${x}" y1="${yb+22}" x2="${x}" y2="${yb}" class="dim" marker-end="url(#a)"/>`;
const T = (x,y,s,anchor='start') => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="tag">${esc(s)}</text>`;
const yes = v => v === 'Oui';
const lbl = (sp,f) => typeof sp.label==='function' ? sp.label(f) : sp.label;
const subOpen = (sp,f) => sp.open ? sp.open(f[sp.k]) : f[sp.k]==='Oui';

const GARN = {k:'garn',label:'Garnissage',kind:'yesno',sub:[
  {k:'garn_mat',label:'Matière du garnissage',kind:'text',ph:'ex. caoutchouc losangé'},
  {k:'garn_ep',label:'Épaisseur',kind:'num',unit:'mm'}]};
const BITRONC = {k:'bitronc',label:'Bi-tronconique',kind:'yesno'};
const MATIERE = {k:'matiere',label:'Matière',kind:'text',ph:'ex. acier, inox 304, PVC…'};
const RACC_TYPES=['SMS','Macon','Symétrique','ACAM','Autre'], RACC_FIX=['Jupe','Bague','Sertie','Demi-coquille','Autre'];
const diff = f => f.racc_id==='Non';
const raccFields = n => [
  {k:`r${n}_type`,label:f=>diff(f)?`Côté ${n} · type de raccord`:'Type de raccord',kind:'chips',options:RACC_TYPES,other:true,when:f=>n===1||diff(f)},
  {k:`r${n}_dim`,label:f=>diff(f)?`Côté ${n} · Ø du raccord`:'Ø du raccord',kind:'num',unit:'mm',when:f=>n===1||diff(f)},
  {k:`r${n}_fix`,label:f=>diff(f)?`Côté ${n} · fixation`:'Fixation',kind:'chips',options:RACC_FIX,other:true,when:f=>n===1||diff(f)}];

/* zigzag vertical (extrémité de bande) */
const zig=(x,y0,y1,dir,step=10)=>{let p='';for(let y=y0;y<y1;y+=step)p+=` L${x+dir*6},${y+step/2} L${x},${Math.min(y+step,y1)}`;return p};

/* raccord symétrique vu de profil (côté gauche), miroir autour de W pour le côté droit */
function COUPLING(W,mirror){
  const X=x=>mirror?W-x:x, P=pts=>pts.map(([x,y])=>X(x)+','+y).join(' ');
  const R=(x0,x1,y0,y1,c,rx=0)=>`<rect x="${Math.min(X(x0),X(x1))}" y="${y0}" width="${Math.abs(x1-x0)}" height="${y1-y0}" rx="${rx}" class="${c}"/>`;
  let g=R(64,80,106,144,'part2');
  g+=R(38,64,90,160,'part2',3);
  g+=`<polygon points="${P([[38,94],[38,80],[26,80],[26,98],[32,98],[32,94]])}" class="part2"/>`;
  g+=`<polygon points="${P([[38,156],[38,170],[26,170],[26,152],[32,152],[32,156]])}" class="part2"/>`;
  return g;
}
const TYPES = {
  bande:{label:'Bande',prefix:'B',vh:250,
    dims:[{k:'largeur',label:'Largeur',x:52,y:118},{k:'longueur',label:'Longueur',x:225,y:216}],
    fields:[
      {k:'matiere',label:'Matière / référence',kind:'text',ph:'ex. PVC 2 plis vert'},
      {k:'epaisseur',label:'Épaisseur',kind:'num',unit:'mm'},
      {k:'typeb',label:'Type de bande',kind:'chips',options:['Jonctionnée fermée','Agrafée','Ouverte','PPSF']},
      {k:'guide',label:'Guide (quantité)',kind:'chips',options:['0','1','2'],open:v=>v==='1'||v==='2',sub:[
        {k:'guide_face',label:'Face',kind:'chips',options:['Inférieure','Supérieure']},
        {k:'guide_profil',label:'Profil du guide',kind:'text',ph:'ex. K13, K15'},
        {k:'guide_pos',label:'Position du guide',kind:'chips',options:['Centré','Décentré'],when:f=>f.guide==='1'},
        {k:'guide_cote',label:f=>f.guide==='2'?'Cote axe guide / bord de bande':'Cote axe du guide / bord de bande',kind:'num',unit:'mm'},
        {k:'guide_entraxe',label:'Entraxe des guides',kind:'num',unit:'mm',when:f=>f.guide==='2'}]},
      {k:'tass',label:'Tasseaux',kind:'yesno',sub:[
        {k:'tass_h',label:'Hauteur',kind:'num',unit:'mm'},
        {k:'tass_l',label:'Largeur du tasseau',kind:'num',unit:'mm'},
        {k:'tass_pas',label:'Pas (entraxe)',kind:'num',unit:'mm'},
        {k:'tass_inc',label:'Incliné',kind:'yesno'}]},
      {k:'bords',label:'Bords de contenance',kind:'yesno',sub:[
        {k:'bords_h',label:'Hauteur des bords',kind:'num',unit:'mm'},
        {k:'bords_entraxe',label:'Entraxe des bords',kind:'num',unit:'mm'},
        {k:'bords_pos',label:'Distance bord de contenance / bord de bande',kind:'num',unit:'mm'}]}],
    svg(f){
      const x0=95,x1=365,y0=62,y1=178; let s=MK;
      if(f.typeb==='PPSF'){const st=(y1-y0)/9;let p=`M${x0},${y0} L${x1},${y0}`;
        for(let y=y0;y<y1-0.1;y+=st)p+=` L${x1+7},${y+st/2} L${x1},${y+st}`;
        p+=` L${x0},${y1}`;for(let y=y1;y>y0+0.1;y-=st)p+=` L${x0-7},${y-st/2} L${x0},${y-st}`;
        s+=`<path d="${p} Z" class="part"/>`+T(230,y0+12,'PPSF','middle');}
      else s+=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" class="part"/>`;
      if(f.typeb==='Jonctionnée fermée'){const st=(y1-y0)/8;let p=`M228,${y0}`;for(let i=0;i<8;i++){const y=y0+i*st;p+=` L236,${y+st/2} L228,${y+st}`}s+=`<path d="${p}" class="thin"/>`;s+=T(240,y0+12,'jonction')}
      if(f.typeb==='Agrafée'){
        s+=`<line x1="230" y1="${y0}" x2="230" y2="${y1}" class="opt" stroke-dasharray="3 2"/>`;
        for(let y=y0+6;y<y1-4;y+=9)s+=`<path d="M221,${y} L239,${y} L239,${y+4} L221,${y+4}" class="opt" stroke-width="1.2"/>`;
        s+=T(244,y0+12,'agrafes + jonc');}
      const bords=yes(f.bords), ti=bords?14:4;
      if(f.guide==='1'||f.guide==='2'){
        const ys=f.guide==='2'?[y0+32,y1-32]:[f.guide_pos==='Décentré'?y0+32:(y0+y1)/2];
        const sup=f.guide_face==='Supérieure',fc=sup?'dessus':f.guide_face==='Inférieure'?'dessous':'';
        ys.forEach(gy=>s+=`<line x1="${x0+2}" y1="${gy}" x2="${x1-2}" y2="${gy}" class="opt" ${sup?'stroke-width="3"':'stroke-dasharray="7 4"'}/>`);

}
function fieldHTML(sp,f){

function optLines(it){
  const out=[];const t=TYPES[it.type],f=it.f;
  const walk=(specs,pre)=>specs.forEach(sp=>{if(sp.when&&!sp.when(f))return;const v=f[sp.k];if(!v)return;
    let val=v==='Autre'&&f[sp.k+'_autre']?f[sp.k+'_autre']:v; if(sp.unit)val+=' '+sp.unit;
    const l=lbl(sp,f);out.push([pre?pre+' · '+l.charAt(0).toLowerCase()+l.slice(1):l,val]); if(sp.sub&&subOpen(sp,f))walk(sp.sub,l.replace(/ \(.*\)$/,''));});
  walk(t.fields,'');return out;
}
function dimLines(it){if(TYPES[it.type].free)return (it.cotes||[]).filter(c=>c.label||c.val).map(c=>[c.label||'—',c.val||'—']);return TYPES[it.type].dims.filter(d=>it.f[d.k]&&(!d.when||d.when(it.f))).map(d=>[(d.full||d.label).replace(' *',''),it.f[d.k]+' mm'])}

    h+=`<section class="card rc-item"><div class="rc-title"><span class="rep">Point ${n+1}</span><h3>${t.label}</h3><span class="note">${esc(it.desig||t.label)} · ${rep} · quantité ${it.qty}</span></div>
      ${planHTML(it,false)}
      <dl class="kv">${[...dimLines(it),...optLines(it)].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>

function recapText(){
  const r=state.rdv;const L=[];

function slug(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)}
function dataToFile(data,name){const[h,b]=data.split(',');const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new File([u],name,{type:h.slice(5,h.indexOf(';'))})}
/* ============ Rapport PDF ============ */
const PLAN_CSS=`.part{fill:#fff;stroke:#15202b;stroke-width:1.6}.part2{fill:#e3e9ee;stroke:#15202b;stroke-width:1.4}.thin{fill:none;stroke:#15202b;stroke-width:1;opacity:.55}.axis{fill:none;stroke:#566573;stroke-width:.8;stroke-dasharray:10 3 2 3}.ext{stroke:#c2410c;stroke-width:.8;opacity:.8}.dim{stroke:#c2410c;stroke-width:1}.mk{fill:#c2410c}.opt{fill:none;stroke:#17784a;stroke-width:1.6}.optf{fill:#17784a;fill-opacity:.18;stroke:#17784a;stroke-width:1}.tag{font:500 9px Helvetica,Arial,sans-serif;fill:#566573}`;
function planPNG(it){
  const t=TYPES[it.type];
  const bubs=t.dims.filter(d=>!d.when||d.when(it.f)).map(d=>{const v=it.f[d.k]||'—';const w=Math.max(44,String(v).length*8+18);
    return `<text x="${d.x}" y="${d.y-15}" text-anchor="middle" style="font:700 9.5px Helvetica,Arial,sans-serif;fill:#c2410c;paint-order:stroke;stroke:#f3f6f9;stroke-width:3">${esc(d.label.replace(' *',''))}</text>
      <rect x="${d.x-w/2}" y="${d.y-11}" width="${w}" height="22" rx="11" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
      <text x="${d.x}" y="${d.y+4.5}" text-anchor="middle" style="font:700 12.5px Consolas,'Courier New',monospace;fill:#15202b">${esc(v)}</text>`}).join('');
  const vh=t.vh||250;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 ${vh}" width="1200" height="${vh*3}"><style>${PLAN_CSS}</style><rect width="400" height="${vh}" fill="#f3f6f9"/>${t.svg(it.f)}${bubs}</svg>`;
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1200;c.height=vh*3;c.getContext('2d').drawImage(img,0,0);res(c.toDataURL('image/png'))};img.onerror=rej;
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});
}
const pdfSafe=s=>String(s??'').replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/[^\x20-\x7E -ÿ—–•€Œœ]/g,'');
async function buildPDF(){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  const doc=await PDFDocument.create();
  const F=await doc.embedFont(StandardFonts.Helvetica),FB=await doc.embedFont(StandardFonts.HelveticaBold);
  const W=595.28,H=841.89,M=42,CW=W-2*M;
  const INK=rgb(.08,.13,.17),MUT=rgb(.34,.4,.45),ACC=rgb(.09,.47,.29),ACCS=rgb(.86,.94,.89),COTE=rgb(.76,.25,.05),SUNK=rgb(.93,.95,.96);
  let page,y;
  const newPage=()=>{page=doc.addPage([W,H]);y=H-M};
  const ensure=h=>{if(y-h<M+24)newPage()};
  const wrap=(s,font,size,maxW)=>{const out=[];String(pdfSafe(s)).split('\n').forEach(par=>{let line='';par.split(' ').forEach(w=>{const tst=line?line+' '+w:w;if(font.widthOfTextAtSize(tst,size)>maxW&&line){out.push(line);line=w}else line=tst});out.push(line)});return out};
  const para=(s,{x=M,size=10,font=F,color=INK,maxW=CW,lh=1.35}={})=>{wrap(s,font,size,maxW).forEach(l=>{ensure(size*lh);page.drawText(l,{x,y:y-size,size,font,color});y-=size*lh})};
  newPage();
  const r=state.rdv;
  page.drawText('RELEVÉ COMMERCIAL',{x:M,y:y-9,size:9,font:FB,color:ACC});y-=22;
  para(r.client,{size:20,font:FB});y-=2;
  para(`Rendez-vous du ${fmtDate(r.date)} à ${r.heure}`,{size:10.5,color:MUT});y-=6;
  const info=[['Interlocuteur',r.contact],['Site / ligne',r.lieu],['Relevé par',state.commercial.nom],['Points relevés',String(state.items.length)]].filter(x=>x[1]);
  info.forEach(([k,v])=>{const lines=wrap(v,F,10,CW-110);ensure(lines.length*13.5);page.drawText(pdfSafe(k),{x:M,y:y-10,size:10,font:F,color:MUT});lines.forEach(l=>{page.drawText(l,{x:M+110,y:y-10,size:10,font:F,color:INK});y-=13.5})});
  if(r.notes){y-=4;para('Notes : '+r.notes,{size:10})}
  y-=8;page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:.8,color:rgb(.8,.84,.88)});y-=14;

  for(let n=0;n<state.items.length;n++){
    const it=state.items[n],t=TYPES[it.type],rep=repOf(it);
    ensure(36+190);
    page.drawRectangle({x:M,y:y-26,width:CW,height:26,color:ACCS});
    page.drawText(pdfSafe(`Point n°${n+1}  —  ${t.label}`),{x:M+10,y:y-17.5,size:12,font:FB,color:ACC});
    const rq=pdfSafe(`${rep}  ·  Quantité ${it.qty}`);page.drawText(rq,{x:W-M-10-F.widthOfTextAtSize(rq,10),y:y-17,size:10,font:F,color:MUT});
    y-=36;
    para(it.desig||t.label,{size:13,font:FB});y-=4;
    const free=!!t.free;const pw=free?0:300,ph=free?0:pw*(t.vh||250)/400;
    if(!free){const png=await doc.embedPng(await planPNG(it));ensure(ph+6);page.drawImage(png,{x:M,y:y-ph,width:pw,height:ph});}
    // caractéristiques à droite du plan si la place le permet
    const kv=[...dimLines(it),...optLines(it)];const kx=M+pw+16,kw=CW-pw-16;let ky=y;
    const rows=kv.map(([k,v])=>({k:wrap(k,F,8.5,kw),v:wrap(v,FB,9.5,kw)}));
    const need=rows.reduce((s,r)=>s+r.k.length*10.5+r.v.length*12+4,0);
    if(!free&&need<=ph){rows.forEach(r=>{r.k.forEach(l=>{page.drawText(l,{x:kx,y:ky-8.5,size:8.5,font:F,color:MUT});ky-=10.5});r.v.forEach(l=>{page.drawText(l,{x:kx,y:ky-9.5,size:9.5,font:FB,color:INK});ky-=12});ky-=4});y-=ph+10}
    else{y-=free?0:ph+10;rows.forEach(r=>{const h=Math.max(r.v.length,1)*13;ensure(h);page.drawText(r.k.join(' '),{x:M,y:y-10,size:9.5,font:F,color:MUT});r.v.forEach((l,i)=>page.drawText(l,{x:M+180,y:y-10-i*13,size:9.5,font:FB,color:INK}));y-=h})}
    if(it.comment){y-=4;const lines=wrap(it.comment,F,10,CW-20);const h=lines.length*13.5+14;ensure(h);page.drawRectangle({x:M,y:y-h,width:CW,height:h,color:SUNK});
      lines.forEach((l,i)=>page.drawText(l,{x:M+10,y:y-7-10-i*13.5,size:10,font:F,color:INK}));y-=h+8}
    if(it.photos.length){
      const gap=12,cw=(CW-gap)/2,chMax=cw*0.75;
      for(let i=0;i<it.photos.length;i+=2){
        const pair=it.photos.slice(i,i+2);const imgs=await Promise.all(pair.map(p=>doc.embedJpg(p.data)));
        const caps=pair.map((p,j)=>wrap(`${rep}-${i+j+1}${p.comment?'  ·  '+p.comment:''}`,F,9,cw));
        const rowH=chMax+6+Math.max(...caps.map(c=>c.length))*11.5+10;ensure(rowH);
        imgs.forEach((im,j)=>{const s=Math.min(cw/im.width,chMax/im.height),w=im.width*s,h=im.height*s,x=M+j*(cw+gap);
          page.drawImage(im,{x:x+(cw-w)/2,y:y-chMax+(chMax-h)/2,width:w,height:h});
          caps[j].forEach((l,k)=>page.drawText(l,{x,y:y-chMax-6-9-k*11.5,size:9,font:k===0?FB:F,color:k===0?COTE:INK}));});
        y-=rowH;
      }
    }
    y-=12;
  }
  const pages=doc.getPages();
  pages.forEach((p,i)=>{const s=pdfSafe(`${r.client}  ·  ${fmtDate(r.date)}  ·  page ${i+1}/${pages.length}`);p.drawText(s,{x:M,y:22,size:8,font:F,color:MUT})});
  return new File([await doc.save()],`Releve-${slug(r.client)}-${r.date}.pdf`,{type:'application/pdf'});
}
function shortText(){
  const r=state.rdv;
  return [`Relevé ${r.client} du ${fmtDate(r.date)} à ${r.heure}`,'',...state.items.map((it,n)=>`Point n°${n+1} — ${TYPES[it.type].label} — ${it.desig||TYPES[it.type].label} (×${it.qty})`),'','Détail complet et photos dans le rapport PDF joint.'].join('\n');

async function send(){
  const c=state.commercial;
  if(!c.email){toast('Indique ton adresse mail avant l\'envoi.');$('c-email')?.focus();return}
  if(!window.PDFLib){toast('Le générateur PDF n\'est pas chargé : vérifie la connexion.');return}
  toast('Création du rapport PDF…');
  let pdf;try{pdf=await buildPDF()}catch(e){toast('Le PDF n\'a pas pu être créé.');console.error(e);return}
  const files=[pdf];
  state.items.forEach(it=>{const rep=repOf(it);it.photos.forEach((p,i)=>files.push(dataToFile(p.data,`${rep}-${i+1}-${slug(it.desig||TYPES[it.type].label)}.jpg`)))});
  const data={title:`Relevé ${state.rdv.client} du ${fmtDate(state.rdv.date)}`,text:shortText(),files};
  try{
    if(navigator.canShare&&navigator.canShare(data)){await navigator.share(data);toast('Choisis ta messagerie et envoie-toi le mail à '+c.email+'.');return}
  }catch(e){if(e.name==='AbortError')return}
  showFallback(pdf);
}

function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.78))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url;})}
async function addPhotos(files){
  for(const f of files){try{draft.photos.push({id:uid(),data:await compress(f),comment:''})}catch(e){toast('Cette image n\'a pas pu être lue.')}}
  $('photos').innerHTML=photosHTML();
}

  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='ph-cam'||e.target.id==='ph-gal'){addPhotos([...e.target.files]);e.target.value=''}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.chip){const k=b.dataset.chip,v=b.dataset.val;draft.f[k]=draft.f[k]===v?'':v;
    $('fields').innerHTML=TYPES[draft.type].fields.map(sp=>fieldHTML(sp,draft.f)).join('');
    $('plan').innerHTML=planHTML(draft,true);return}
  if(b.dataset.add){draft={id:uid(),type:b.dataset.add,desig:'',qty:1,f:{},cotes:[],photos:[],comment:''};view='edit';render(true);return}
  if(b.dataset.open){openItem(state.items.find(i=>i.id===b.dataset.open));return}
  if(b.dataset.askdel){pendingDel=b.dataset.askdel;renderRdv();return}
  if(b.dataset.cdel){draft.cotes=draft.cotes.filter(c=>c.id!==b.dataset.cdel);$('cotes').innerHTML=cotesHTML();return}
  if(b.dataset.phdel){draft.photos=draft.photos.filter(p=>p.id!==b.dataset.phdel);$('photos').innerHTML=photosHTML();return}
  const a=b.dataset.act;if(!a)return;
  switch(a){
    case 'create':{if(!state.rdv.client.trim()){$('rdv-err').hidden=false;$('r-client').focus();return}state.started=true;save();render(true);break}
    case 'edit-rdv':state.started=false;state.example=false;render(true);break;
    case 'new':
      if(armed!=='new'&&state.items.length&&!state.example){armed='new';b.textContent='Confirmer : effacer ce rendez-vous';b.classList.add('danger','armed');return}
      state=blank(state);save();view='rdv';render(true);break;
    case 'del-cancel':pendingDel=null;renderRdv();break;
    case 'del-confirm':{const it=state.items.find(i=>i.id===pendingDel);const rep=it?repOf(it):'';state.items=state.items.filter(i=>i.id!==pendingDel);pendingDel=null;save();renderRdv();toast(`Point ${rep} supprimé.`);break}
    case 'add-cote':draft.cotes.push({id:uid(),label:'',val:''});$('cotes').innerHTML=cotesHTML();$('cotes').querySelector('.cote-row:last-child input').focus();break;
    case 'qm':draft.qty=Math.max(1,draft.qty-1);$('e-qty').textContent=draft.qty;break;
    case 'qp':draft.qty++;$('e-qty').textContent=draft.qty;break;
    case 'cancel':view='rdv';draft=null;render(true);break;
    case 'save-item':{
      const miss=TYPES[draft.type].dims.filter(d=>d.req&&!draft.f[d.k]);
      if(miss.length){const er=$('e-err');er.textContent=`Cote obligatoire manquante : ${miss.map(d=>d.label.replace(' *','')).join(', ')}.`;er.hidden=false;$('d-'+miss[0].k).focus();return}
      const i=state.items.findIndex(x=>x.id===draft.id);if(i>=0)state.items[i]=draft;else state.items.push(draft);
      state.example=false;state.started=true;save();const rep=repOf(draft);view='rdv';draft=null;render(true);toast(`${rep} enregistré.`);break}
    case 'del-item':
      if(armed!=='del'){armed='del';b.textContent='Confirmer la suppression';b.classList.add('armed');return}
      state.items=state.items.filter(x=>x.id!==draft.id);save();view='rdv';draft=null;render(true);break;
    case 'recap':view='recap';render(true);break;
    case 'back':view='rdv';render(true);break;
    case 'send':send();break;
    case 'copy':copyText();break;
    case 'pdf':viewPDF();break;
  }
});
render(true);
</script>
</body>
</html>
