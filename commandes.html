<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e9062">
<title>Bon d'intervention</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shell.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="commun.css">
<style>
  a.gros { display: flex; align-items: center; gap: 16px; background: var(--vert); color: #fff; border-radius: 22px; padding: 20px; text-decoration: none; box-shadow: 0 6px 18px rgba(14,144,98,.25); margin: 6px 0; }
  a.gros .pic { flex: none; width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,.18); display: grid; place-items: center; }
  a.gros .tx b { display: block; font-size: 22px; } a.gros .tx span { display: block; font-size: 14px; opacity: .9; margin-top: 3px; }
  a.gros .fl { margin-left: auto; opacity: .85; display: flex; }
  .sep { display: flex; align-items: center; gap: 10px; color: var(--mute); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin: 20px 0 12px; }
  .sep::before, .sep::after { content: ''; flex: 1; height: 1px; background: var(--line); }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="haut">
    <a href="./">← Accueil</a>
    <h1>Bon d'intervention</h1>
    <button class="btn" id="btnActualiser" type="button">Actualiser</button>
  </div>
  <a class="gros" id="btnVierge" href="intervention.html"><div class="pic" id="icVierge"></div><div class="tx"><b>Bon vierge</b><span>Sans commande : je saisis tout</span></div><span class="fl" id="flVierge"></span></a>
  <div class="sep" id="sepCmd">ou depuis une commande en cours</div>
  <input class="champ" id="recherche" type="search" placeholder="Rechercher (N° de commande, client)">
  <div id="infos"></div>
  <div class="liste" id="liste"></div>
</div>

<script src="config.js"></script>
<script src="commun.js"></script>
<script>
const CLE_CACHE = 'commandesCache';
let commandes = [];
// Si le script n'est pas à jour, le client est repris du nom du fichier (« CD26xxxx - Client »)
function corrigerClient(c) {
  if (c.client) return c;
  const base = String(c.nom || '').replace(/\.pdf$/i, '');
  const m = base.match(/^(.+?)\s+[-–—]\s+(.+)$/) || base.match(/^([^-–—]+?)\s*[-–—]\s*(.+)$/);
  return m ? Object.assign({}, c, { cd: m[1].trim(), client: m[2].trim() }) : c;
}

function enAttente() {
  // Commandes dont le bon est gardé sur l'appareil en attendant le réseau
  try { return (JSON.parse(localStorage.getItem('bonsEnAttente')) || []).map(b => b.donnees && b.donnees.docId).filter(Boolean); }
  catch (e) { return []; }
}

function dessiner(horsLigne) {
  const filtre = Nova.norm(document.getElementById('recherche').value.trim());
  const attente = enAttente();
  const liste = document.getElementById('liste');
  liste.innerHTML = '';
  let n = 0;
  commandes.forEach(c => {
    if (filtre && Nova.norm(c.cd + ' ' + c.client + ' ' + c.nom).indexOf(filtre) < 0) return;
    n++;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'item';
    const t = document.createElement('b');
    t.textContent = c.cd || c.nom;
    b.appendChild(t);
    if (c.client) {
      const s = document.createElement('small');
      s.textContent = c.client;
      b.appendChild(s);
    }
    if (attente.indexOf(c.id) >= 0) {
      const a = document.createElement('span');
      a.className = 'attente';
      a.textContent = 'Bon en attente d\'envoi';
      b.appendChild(a);
    }
    b.onclick = () => ouvrir(c);
    liste.appendChild(b);
  });
  let texte = n + (n > 1 ? ' commandes' : ' commande');
  if (!commandes.length) texte = 'Aucune commande en cours.';
  else if (!n) texte = 'Aucun résultat.';
  if (horsLigne) texte += ' · liste enregistrée sur l\'appareil (hors ligne)';
  document.getElementById('infos').textContent = texte;
}

function ouvrir(c) {
  const url = 'intervention.html?doc=' + encodeURIComponent(c.id) + '&cd=' + encodeURIComponent(c.cd) + '&client=' + encodeURIComponent(c.client);
  let lecture = null;   // contact + email lus dans le PDF (sans IA)
  Nova.ouvrirVisio({
    id: c.id,
    titre: (c.cd ? c.cd : '') + (c.client ? ' · ' + c.client : ''),
    surDocument: bytes => { lecture = Nova.extraireContact(bytes); },
    action: { texte: 'Faire le bon d\'intervention', fn: async () => {
      let x = {};
      try { if (lecture) x = await Promise.race([lecture, new Promise(r => setTimeout(() => r({}), 8000))]) || {}; } catch (e) {}
      location.href = url + (x.contact ? '&contact=' + encodeURIComponent(x.contact) : '') + (x.email ? '&email=' + encodeURIComponent(x.email) : '');
    } }
  });
}

async function charger() {
  const infos = document.getElementById('infos');
  infos.textContent = 'Chargement...';
  let memo = null;
  try { memo = JSON.parse(localStorage.getItem(CLE_CACHE)); } catch (x) {}
  if (Array.isArray(memo)) { commandes = memo.map(corrigerClient); dessiner(true); }   // liste enregistrée affichée tout de suite
  try {
    const res = await Nova.api('commandes', null, 12000);
    commandes = res.commandes.map(corrigerClient);
    try { localStorage.setItem(CLE_CACHE, JSON.stringify(commandes)); } catch (e) {}
    dessiner(false);
  } catch (e) {
    if (e.code === 'reseau') {
      try {
        const memo = JSON.parse(localStorage.getItem(CLE_CACHE));
        if (Array.isArray(memo)) { commandes = memo.map(corrigerClient); dessiner(true); return; }
      } catch (x) {}
    }
    infos.textContent = '';
    const boite = document.createElement('div');
    boite.className = 'erreurPage';
    boite.textContent = e.message;
    document.getElementById('liste').innerHTML = '';
    document.getElementById('liste').appendChild(boite);
  }
}

if (Nova.exiger('intervention')) {
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('icVierge').innerHTML = Shell.svg('plus', 32);
    document.getElementById('flVierge').innerHTML = Shell.svg('chevron', 24);
  });
  document.getElementById('btnActualiser').onclick = charger;
  document.getElementById('recherche').addEventListener('input', () => dessiner(false));
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  charger();
}
</script>
<script src="shell.js"></script>
</body>
</html>
