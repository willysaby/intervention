<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e9062">
<title>Utilisateurs</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shell.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="commun.css">
<style>
  [hidden] { display: none !important; }
  .page { max-width: 1040px; }
  .info { border-radius: 14px; padding: 12px 14px; margin: 0 0 12px; font-size: 14px; background: var(--warnbg); color: var(--warnink); }
  .barre { display: flex; gap: 8px; align-items: center; margin: 4px 0 12px; flex-wrap: wrap; }
  .barre input { flex: 1; min-width: 180px; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
  .liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .ligne { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; cursor: pointer; text-align: left; font-family: inherit; color: var(--ink); width: 100%; }
  .ligne.alerte { border: 2px solid #e0b100; }
  .ligne.inactif { opacity: .6; }
  .ini { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--accentbg); color: var(--lien); display: grid; place-items: center; font-weight: 800; font-size: 16px; }
  .ligne .qui { flex: 1; min-width: 0; }
  .ligne .qui b { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .mini span { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--pastille); color: var(--mute); }
  .mini span.adm { background: var(--accentbg); color: var(--lien); }
  .mini span.off { background: var(--kobg); color: var(--koink); }
  .mini span.nv { background: var(--warnbg); color: var(--warnink); }
  .chev { color: var(--mute); font-size: 22px; }
  /* éditeur plein écran */
  #editeur { position: fixed; inset: 0; background: var(--bg, #fff); z-index: 50; overflow: auto; padding: 12px 16px 100px; }
  #editeur .cadre { max-width: 640px; margin: auto; }
  #editeur h2 { margin: 6px 0 4px; font-size: 21px; }
  .sec { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 14px; }
  .sec h4 { margin: 0 0 10px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); }
  .sec label.l { display: block; font-weight: 700; font-size: 13px; margin: 0 0 4px; }
  .codeBox { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 20px; letter-spacing: .04em; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg, #fff); overflow-wrap: anywhere; text-align: center; min-height: 52px; }
  .trois { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .btnP { padding: 12px 8px; font-size: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; cursor: pointer; font-family: inherit; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .presets .btnP { flex: 1; min-width: 0; font-size: 13px; padding: 10px 4px; }
  .interr { display: flex; gap: 12px; align-items: center; padding: 12px 2px; border-top: 1px solid var(--line); cursor: pointer; }
  .interr:first-of-type { border-top: 0; }
  .interr .txt { flex: 1; }
  .interr .txt b { display: block; font-size: 15px; }
  .interr .txt small { color: var(--mute); font-size: 12px; }
  .interr input { display: none; }
  .sw { flex: none; width: 50px; height: 30px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .interr input:checked + .sw { background: #0e9062; }
  .interr input:checked + .sw::after { left: 23px; }
  .interr.fige { opacity: .55; pointer-events: none; }
  .app { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; font-size: 14px; }
  .app.nouveau { background: var(--warnbg); border-color: transparent; }
  .app .qui2 { flex: 1; min-width: 150px; }
  .bas { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; justify-content: center; z-index: 60; }
  .bas .btn { min-width: 140px; }
  #stopBox { margin: 0 0 16px; }
  .stopGros { width: 100%; border: 0; border-radius: 18px; padding: 20px; font-family: inherit; font-size: 20px; font-weight: 800; background: #c62828; color: #fff; box-shadow: 0 6px 18px rgba(198,40,40,.3); }
  .stopGros.confirme { background: #7f1010; }
  .stopGros.vert { background: var(--vert); box-shadow: 0 6px 18px rgba(14,144,98,.25); }
  .stopRouge { background: var(--kobg); color: var(--koink); border: 2px solid var(--koink); border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; font-weight: 700; }
  .stopInfo { color: var(--mute); font-size: 13px; text-align: center; margin-top: 8px; }
  .stopAnnuler { display: block; margin: 8px auto 0; background: none; border: 0; color: var(--lien); font-weight: 700; font-size: 15px; padding: 8px; font-family: inherit; }
  #msgEd { font-weight: 600; text-align: center; margin: 14px 0; min-height: 1.2em; }
  #msgEd.ko { color: var(--koink); } #msgEd.ok { color: var(--okink); }
  .nouveauCode { background: var(--okbg); color: var(--okink); border-radius: 12px; padding: 14px; margin-top: 14px; font-weight: 700; text-align: center; }
  .nouveauCode code { display: block; font-size: 22px; margin: 6px 0 10px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="haut"><a href="./">← Accueil</a><h1>Utilisateurs et droits</h1></div>
  <div id="stopBox"></div>
  <div id="infos"></div>
  <div id="erreur" class="erreurPage" hidden></div>
  <div class="barre">
    <input id="q" type="search" placeholder="Rechercher une personne" autocomplete="off">
    <button class="btn vert" type="button" id="btnNouveau">+ Nouvel utilisateur</button>
  </div>
  <div class="liste" id="liste"></div>
</div>

<div id="editeur" hidden>
  <div class="cadre">
    <h2 id="edTitre"></h2>
    <div class="sec">
      <h4>Identité</h4>
      <label class="l" for="eNom">Nom et prénom</label>
      <input class="champ" id="eNom" maxlength="60" autocomplete="off">
    </div>
    <div class="sec" id="secCode">
      <h4>Code de connexion</h4>
      <div class="codeBox" id="codeBox">••••••••</div>
      <div class="trois">
        <button type="button" class="btnP" id="bVoir">Afficher</button>
        <button type="button" class="btnP" id="bCopier">Copier</button>
        <button type="button" class="btnP" id="bNeuf">Nouveau code</button>
      </div>
    </div>
    <div class="sec">
      <h4>Droits</h4>
      <div class="presets" id="presets"></div>
      <div id="interrupteurs"></div>
    </div>
    <div class="sec" id="secActif">
      <label class="interr" style="padding:0;border:0"><div class="txt"><b>Compte actif</b><small>Désactivé : la personne ne peut plus se connecter</small></div><input type="checkbox" id="eActif"><span class="sw"></span></label>
    </div>
    <div class="sec" id="secApps"><h4>Appareils</h4><div id="apps"></div></div>
    <div id="msgEd"></div>
    <div id="codeCree"></div>
  </div>
  <div class="bas">
    <button type="button" class="btn" id="edFermer">Fermer</button>
    <button type="button" class="btn vert" id="edSauver" disabled>Enregistrer</button>
  </div>
</div>

<script src="config.js"></script>
<script src="commun.js"></script>
<script src="shell.js"></script>
<script>
const LIB = {
  jonction: ['Jonction', 'Réglages et fiches de jonction'],
  intervention: ['Intervention', 'Bons d\'intervention et commandes en cours'],
  nc: ['Non-conformités', 'Saisie et liste des NC'],
  achats: ['Achats', 'Commandes fournisseurs (consommables)'],
  gestion: ['Gestion', 'Interventions terminées et suivi'],
  fournisseurs: ['Fournisseurs', 'Annuaire des fournisseurs'],
  admin: ['Administrateur', 'Tous les droits + gestion des utilisateurs']
};
const COURT = { jonction: 'Jonction', intervention: 'Intervention', nc: 'NC', achats: 'Achats', gestion: 'Gestion', fournisseurs: 'Fournisseurs', admin: 'Administrateur' };
const PRESETS = [['Technicien', ['jonction', 'intervention']], ['Gestionnaire', ['jonction', 'intervention', 'nc', 'achats', 'gestion', 'fournisseurs']], ['Administrateur', ['admin']]];
let DROITS = [], donnees = null, courant = null, droitsEd = [], modifie = false, codeVisible = false;
const el = id => document.getElementById(id);
const norm = s => Nova.norm(s);
function h(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function jolieDate(s) { const m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}:\d{2}))?/.exec(s || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] + (m[4] ? ' ' + m[4] : '') : (s || ''); }
function initiales(n) { return String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase() || '?'; }

function dessiner() {
  const infos = el('infos'); infos.innerHTML = '';
  if (donnees.ancien) infos.appendChild(h('div', 'info', 'Les anciens codes communs (technicien, gestionnaire, administrateur) fonctionnent encore. Quand tout le monde a son code personnel, passe LOGIN_ANCIEN à false dans Code.gs et redéploie.'));
  if (!donnees.jonctionConfiguree) infos.appendChild(h('div', 'info', 'La page Jonction n\'est pas encore reliée aux comptes personnels : ajoute JONCTION_CODE_ACCES et JONCTION_CODE_ADMIN dans les propriétés du script.'));
  const q = norm(el('q').value.trim());
  const zone = el('liste'); zone.innerHTML = '';
  donnees.users.filter(u => !q || norm(u.nom).indexOf(q) >= 0)
    .sort((a, b) => (b.appareils.some(x => x.statut === 'Nouveau') - a.appareils.some(x => x.statut === 'Nouveau')) || (b.actif - a.actif) || a.nom.localeCompare(b.nom, 'fr'))
    .forEach(u => {
      const nv = u.appareils.some(a => a.statut === 'Nouveau');
      const b = h('button', 'ligne' + (nv ? ' alerte' : '') + (u.actif ? '' : ' inactif')); b.type = 'button';
      b.appendChild(h('div', 'ini', initiales(u.nom)));
      const qui = h('div', 'qui'); qui.appendChild(h('b', null, u.nom));
      const mini = h('div', 'mini');
      if (!u.actif) mini.appendChild(h('span', 'off', 'Désactivé'));
      if (nv) mini.appendChild(h('span', 'nv', '⚠ Nouvel appareil'));
      if (u.droits.indexOf('admin') >= 0) mini.appendChild(h('span', 'adm', 'Administrateur'));
      else u.droits.forEach(d => mini.appendChild(h('span', null, COURT[d] || d)));
      qui.appendChild(mini); b.appendChild(qui); b.appendChild(h('span', 'chev', '›'));
      b.onclick = () => ouvrir(u);
      zone.appendChild(b);
    });
  if (!zone.children.length) zone.appendChild(h('div', 'info', 'Aucun utilisateur.'));
}

// ---- éditeur ----
function majCode() {
  el('codeBox').textContent = codeVisible && courant ? courant.code : '••••••••';
  el('bVoir').textContent = codeVisible ? 'Masquer' : 'Afficher';
}
function interrupteurs() {
  const z = el('interrupteurs'); z.innerHTML = '';
  const admin = droitsEd.indexOf('admin') >= 0;
  DROITS.forEach(d => {
    const l = h('label', 'interr' + (admin && d !== 'admin' ? ' fige' : ''));
    const t = h('div', 'txt'); t.appendChild(h('b', null, LIB[d][0])); t.appendChild(h('small', null, LIB[d][1])); l.appendChild(t);
    const c = h('input'); c.type = 'checkbox'; c.checked = admin ? true : droitsEd.indexOf(d) >= 0;
    c.onchange = () => { droitsEd = c.checked ? droitsEd.concat([d]) : droitsEd.filter(x => x !== d); modifie = true; el('edSauver').disabled = false; interrupteurs(); };
    l.appendChild(c); l.appendChild(h('span', 'sw')); z.appendChild(l);
  });
}
function presets() {
  const z = el('presets'); z.innerHTML = '';
  PRESETS.forEach(([n, d]) => { const b = h('button', 'btnP', n); b.type = 'button'; b.onclick = () => { droitsEd = d.filter(x => DROITS.indexOf(x) >= 0); modifie = true; el('edSauver').disabled = false; interrupteurs(); }; z.appendChild(b); });
}
function ouvrir(u) {
  courant = u || null; modifie = false; codeVisible = false;
  droitsEd = u ? u.droits.slice() : ['jonction', 'intervention'];
  el('edTitre').textContent = u ? u.nom : 'Nouvel utilisateur';
  el('eNom').value = u ? u.nom : '';
  el('eActif').checked = u ? u.actif : true;
  el('secCode').hidden = el('secActif').hidden = el('secApps').hidden = !u;
  el('edSauver').textContent = u ? 'Enregistrer' : 'Créer le compte';
  el('edSauver').disabled = !!u;
  el('msgEd').textContent = ''; el('msgEd').className = ''; el('codeCree').innerHTML = '';
  majCode(); presets(); interrupteurs(); appareils();
  el('editeur').hidden = false; el('page').hidden = true; window.scrollTo(0, 0); el('editeur').scrollTop = 0;
}
function fermer() { el('editeur').hidden = true; el('page').hidden = false; courant = null; }
function appareils() {
  const z = el('apps'); z.innerHTML = '';
  if (!courant) return;
  if (!courant.appareils.length) { z.appendChild(h('div', null, 'Aucun appareil enregistré pour l\'instant.')).style.color = 'var(--mute)'; return; }
  courant.appareils.forEach(a => {
    const d = h('div', 'app' + (a.statut === 'Nouveau' ? ' nouveau' : ''));
    d.appendChild(h('span', 'qui2', a.libelle + ' · ' + jolieDate(a.date) + (a.statut === 'Nouveau' ? ' · NOUVEAU' : '')));
    const act = (t, action) => { const bt = h('button', 'btnP', t); bt.type = 'button'; bt.style.padding = '8px 12px';
      bt.onclick = async () => { if (action === 'supprimer' && !confirm('Supprimer cet appareil de la liste ?')) return; bt.disabled = true;
        try { await Nova.api('usersAppareil', { ligne: a.ligne, nom: a.nom, id: a.id, action: action }, 20000); const nom = courant.nom; await charger(); const u = donnees.users.find(x => x.nom === nom); if (u) ouvrir(u); }
        catch (e) { bt.disabled = false; el('msgEd').className = 'ko'; el('msgEd').textContent = e.message; } };
      d.appendChild(bt); };
    if (a.statut === 'Nouveau') act('C\'est bon', 'valider');
    act('Supprimer', 'supprimer');
    z.appendChild(d);
  });
}
el('eNom').addEventListener('input', () => { modifie = true; el('edSauver').disabled = false; });
el('eActif').addEventListener('change', () => { modifie = true; el('edSauver').disabled = false; });
el('bVoir').onclick = () => { codeVisible = !codeVisible; majCode(); };
el('bCopier').onclick = async () => { try { await navigator.clipboard.writeText(courant.code); el('bCopier').textContent = 'Copié ✓'; setTimeout(() => el('bCopier').textContent = 'Copier', 1500); } catch (x) { codeVisible = true; majCode(); } };
el('bNeuf').onclick = async () => {
  if (!confirm('Générer un nouveau code pour ' + courant.nom + ' ? L\'ancien code ne marchera plus.')) return;
  try { const r = await Nova.api('usersNouveauCode', { ligne: courant.ligne, ancienNom: courant.nom }, 20000); courant.code = r.code; codeVisible = true; majCode(); el('msgEd').className = 'ok'; el('msgEd').textContent = '✓ Nouveau code généré : transmets-le à la personne.'; }
  catch (e) { el('msgEd').className = 'ko'; el('msgEd').textContent = e.message; }
};
el('edFermer').onclick = () => { if (modifie && !confirm('Quitter sans enregistrer les modifications ?')) return; fermer(); };
el('btnNouveau').onclick = () => ouvrir(null);
function droitsObj() { const o = {}; DROITS.forEach(d => { o[d] = droitsEd.indexOf(d) >= 0; }); return o; }
el('edSauver').onclick = async () => {
  const msg = el('msgEd'); msg.className = ''; msg.textContent = 'Enregistrement...'; el('edSauver').disabled = true;
  try {
    if (courant) {
      await Nova.api('usersSauver', { utilisateur: { ligne: courant.ligne, ancienNom: courant.nom, nom: el('eNom').value, code: courant.code, actif: el('eActif').checked, droits: droitsObj() } }, 20000);
      modifie = false; await charger(); fermer();
    } else {
      const r = await Nova.api('usersCreer', { utilisateur: { nom: el('eNom').value, droits: droitsObj() } }, 20000);
      modifie = false; msg.textContent = '';
      el('codeCree').innerHTML = ''; const d = h('div', 'nouveauCode', 'Compte créé. Code à transmettre à la personne :'); d.appendChild(h('code', null, r.code));
      const b = h('button', 'btnP', 'Copier le code'); b.type = 'button'; b.onclick = async () => { try { await navigator.clipboard.writeText(r.code); b.textContent = 'Copié ✓'; } catch (x) {} }; d.appendChild(b);
      el('codeCree').appendChild(d); el('edSauver').hidden = true; el('edFermer').textContent = 'Terminer'; await charger();
    }
  } catch (e) { msg.className = 'ko'; msg.textContent = e.message; el('edSauver').disabled = false; }
};
el('q').addEventListener('input', () => donnees && dessiner());


/* ---------- Arrêt d'urgence des envois ---------- */
let confirmerStop = false;
function dessinerStop() {
  const p = donnees && donnees.protections, z = el('stopBox');
  if (!p) { z.innerHTML = ''; return; }
  z.innerHTML = '';
  if (p.bloque) {
    const r = document.createElement('div'); r.className = 'stopRouge';
    r.textContent = '⛔ Tous les envois de mails sont bloqués' + (p.bloquePar ? ' (par ' + p.bloquePar + (p.bloqueLe ? ', ' + p.bloqueLe : '') + ')' : '') + '. Les bons et commandes restent gardés sur les appareils.';
    z.appendChild(r);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'stopGros vert'; b.textContent = 'Réactiver les envois';
    b.onclick = () => changerStop(false, b);
    z.appendChild(b);
  } else {
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'stopGros' + (confirmerStop ? ' confirme' : '');
    b.textContent = confirmerStop ? 'Confirmer : bloquer tous les envois' : '⛔ Stop, on bloque tout';
    b.onclick = () => { if (!confirmerStop) { confirmerStop = true; dessinerStop(); } else changerStop(true, b); };
    z.appendChild(b);
    if (confirmerStop) {
      const a = document.createElement('button'); a.type = 'button'; a.className = 'stopAnnuler'; a.textContent = 'Annuler';
      a.onclick = () => { confirmerStop = false; dessinerStop(); };
      z.appendChild(a);
    }
    const i = document.createElement('div'); i.className = 'stopInfo';
    i.textContent = 'Envois aujourd\'hui : ' + p.jour + ' sur ' + p.plafondJour + ' · maximum ' + p.plafondHeure + ' par heure et par personne';
    z.appendChild(i);
  }
}
async function changerStop(bloquer, bouton) {
  bouton.disabled = true;
  try {
    const r = await Nova.api('usersBloquer', { bloquer: bloquer }, 20000);
    donnees.protections = r; confirmerStop = false; dessinerStop();
  } catch (e) { el('erreur').textContent = e.message; el('erreur').hidden = false; bouton.disabled = false; }
}
async function charger() {
  try { donnees = await Nova.api('usersListe', null, 20000); } catch (e) { el('erreur').textContent = e.message; el('erreur').hidden = false; return; }
  DROITS = donnees.droits; el('erreur').hidden = true; dessiner(); dessinerStop();
}
// bouton « Terminer » après création : on remet l'éditeur à l'état normal
const ferme0 = el('edFermer').onclick;
el('edFermer').onclick = () => { if (el('edSauver').hidden) { el('edSauver').hidden = false; el('edFermer').textContent = 'Fermer'; modifie = false; fermer(); return; } ferme0(); };
if (Nova.exiger('admin')) charger();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
